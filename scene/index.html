<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歌曲情境圖</title>
<meta name="theme-color" content="#0d0b09">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=1">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：情境圖固定鋪滿畫面，一次只顯示一段歌詞（像字幕），點一下螢幕換下一段，不用滑。直的手機時圖放上面整張。永遠暗色。 */
:root{
  --bg:#0d0b09; --ink:#f6efe4; --muted:#bfb3a3; --line:rgba(255,255,255,.16); --glow:#f2c27b; --glow-soft:rgba(242,194,123,.16);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body.play{overflow:hidden;height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bg{position:fixed;left:0;top:0;z-index:0}
.blur{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.15);display:none}
.bg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;transition:background .6s ease}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;transition:opacity .5s ease}
.spot i{width:12px;height:12px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 5px var(--glow-soft),0 0 16px var(--glow)}
.spot b{font-family:var(--display);font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 8px #000,0 0 2px #000;white-space:nowrap}
.spot.dim{opacity:0}
.spot.on i{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(242,194,123,0),0 0 24px var(--glow)}}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;opacity:.55;animation:tw 3s ease-in-out infinite}
.stars.on i{opacity:1;box-shadow:0 0 6px #fff,0 0 10px rgba(255,240,200,.8)}
@keyframes tw{50%{opacity:.15}}
/* 讓字看得清楚：歌詞那一帶暗下來 */
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 46%,rgba(0,0,0,.7) 66%,rgba(0,0,0,.85) 100%)}
.bar{position:fixed;left:0;right:0;top:0;z-index:4;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.bar a{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.bar .by{color:var(--muted);font-size:12px}
.bar .edit{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0}
.bar .story{flex:1 1 200px;min-width:0;font-size:12px;line-height:1.45;color:rgba(246,239,228,.82);text-shadow:0 1px 6px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-self:center}
@media (max-width:760px){.bar .story{order:8;flex-basis:100%;font-size:11.5px}}
.chainbar{flex-basis:100%;order:9;display:flex;gap:4px;margin-top:6px}
.chainbar button{min-width:38px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:5px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(20,16,12,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden}
body.op .chainbar small{display:none}body.op .chainbar.grp{padding:0 16px;gap:24px;box-sizing:border-box}body.op .chainbar button{padding:3px 8px}
.chainbar.grp{gap:8px}.cg{display:flex;flex-direction:column;gap:3px}.cgr{display:flex;gap:4px}
.cgl{width:0;min-width:100%;box-sizing:border-box;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden;font-size:11px;color:var(--muted);border-bottom:2px solid rgba(242,194,123,.45);padding:0 2px 2px;text-shadow:0 1px 6px #000}.cgl b{color:var(--glow);font-size:12.5px;font-family:var(--display)}.cgl span{overflow:hidden;text-overflow:ellipsis}
.cg.cnow .cgl{border-bottom-color:var(--glow)}
@media (max-width:760px){.cgl span{display:none}.cgl b{font-size:11px}.chainbar.grp{gap:5px}.cgr{gap:3px}}
.chainbar button.on{background:rgba(242,194,123,.3);border-color:var(--glow)}
.chainbar .cw{display:flex;align-items:baseline;gap:5px;white-space:nowrap;max-width:100%;overflow:hidden}.chainbar .cw b{flex:none}
.chainbar .cw em{font-style:normal;font-size:11px;color:var(--muted)}.chainbar button.on .cw em{color:var(--glow)}
.chainbar .cw b{font-family:var(--display);font-size:16px}
.chainbar small.co{color:rgba(246,239,228,.85)}.chainbar small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:760px){.chainbar{gap:3px}.chainbar button{align-items:center;padding:4px 2px;min-width:24px}.chainbar small,.chainbar .cw em{display:none}.chainbar .cw b{font-size:14px}}
.bar .now{flex-basis:100%;order:9;font-size:12.5px;color:var(--glow);letter-spacing:.06em;text-shadow:0 1px 6px #000;min-height:1.4em}
.bar .now b{font-family:var(--display);font-size:15px;margin:0 4px}.bar .now span{color:var(--muted);letter-spacing:0;margin-left:2px}
/* 點螢幕換段：整個畫面都是按鈕，左邊三分之一往回 */
.tap{position:fixed;inset:0;z-index:2;cursor:pointer}
.sub{position:fixed;z-index:3;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 40px));bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);pointer-events:none}
.sub p{margin:0;font-family:var(--display);font-size:20px;line-height:1.6;color:#fff;text-shadow:0 0 14px rgba(242,194,123,.35),0 1px 10px rgba(0,0,0,.95),0 0 2px #000}
.sub .cue{font-size:12.5px;color:var(--glow);letter-spacing:.06em;text-shadow:0 1px 6px #000;margin-bottom:4px}
.sub .cue b{font-family:var(--display);font-size:15px;margin:0 4px}.sub .cue span{color:var(--muted);letter-spacing:0;margin-left:2px}
.sub .next{margin-top:12px;opacity:.38}
.sub .ln{transition:opacity .3s,color .3s}
.sub.lines .ln{opacity:.55}.sub.lines .ln.past{opacity:.3}.sub.lines .ln.on{opacity:1;color:#fff3dc;text-shadow:0 0 16px rgba(242,194,123,.75),0 1px 10px rgba(0,0,0,.95)}
.sub .next small{display:block;font-size:11.5px;color:var(--glow);letter-spacing:.08em;margin-bottom:1px;text-shadow:0 1px 6px #000}
.sub .next p{font-size:17px;text-shadow:0 1px 8px #000}
.sub.swap{animation:swap .45s ease}
@keyframes swap{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.foot{position:fixed;z-index:3;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;pointer-events:none}
.foot button{pointer-events:auto;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.player{position:fixed;z-index:3;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.player button{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.player button.rec{border-color:#e46b6b;color:#ffb4b4}
.player .t{font-variant-numeric:tabular-nums;min-width:5.5em}
@media (max-width:640px){.player .t{display:none}.player button,.foot button{padding:6px 10px}.player{right:16px;flex-wrap:wrap;bottom:calc(env(safe-area-inset-bottom,0px) + 54px)}}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);background:rgba(0,0,0,.65);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink);pointer-events:none;white-space:nowrap}
@media (max-width:640px){.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}}
.bar .edit+.edit{margin-left:0}
.toc{position:fixed;inset:0;z-index:20;background:rgba(10,8,6,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.toc .top{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:6px 0 12px;background:linear-gradient(rgba(10,8,6,.98) 70%,rgba(10,8,6,0))}
.toc .top b{flex:1;font-family:var(--display);font-size:17px}
.toc button{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.toc .sec{max-width:680px;margin:0 auto 18px}
.toc .sec>button{border:0;background:none;padding:4px 0;color:var(--glow);font-size:13px;letter-spacing:.06em}
.toc .sec>button b{font-family:var(--display);font-size:15px;margin:0 4px}
.toc .l{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:none;padding:7px 8px;margin:0 -8px;font-family:var(--display);font-size:18px;line-height:1.45;color:var(--ink)}
.toc .l:active,.toc .l.cur{background:var(--glow-soft)}
.toc .l small{color:var(--muted);font-family:var(--body);font-size:11px;margin-left:8px}
.sub .ln2{pointer-events:auto;cursor:pointer}
.opb{margin-left:auto;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--muted);border-radius:99px;height:30px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer}.opb.on{color:var(--glow);border-color:rgba(242,194,123,.5)}.opb+.pgpill{margin-left:0}
body.op .sub,body.op.lay-top .sub{left:16px;right:16px;width:auto;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);overflow-y:auto;pointer-events:auto;-webkit-overflow-scrolling:touch}
.opg{display:grid;gap:.55em 24px;align-items:start;margin:0;padding:12px 16px}
#opspots{position:fixed;left:0;top:0;z-index:5;pointer-events:none;transform-origin:0 0}
#opspots .spot b{font-size:18px;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:8px}
.orh{display:flex;flex-direction:column;gap:1px;padding:0 0 6px;border-bottom:1px solid rgba(242,194,123,.3);opacity:.7}.orh.now{opacity:1;border-bottom-color:var(--glow)}
.orh b{font-family:var(--display);font-size:.92em;color:var(--glow)}.orh span{font-size:.72em;line-height:1.45;color:var(--ink)}.orh em{font-style:normal;font-size:11px;color:var(--muted)}
.ob{opacity:.72;transition:opacity .3s;border-left:2px solid transparent;padding:.3em .6em;margin-left:0;border-radius:10px;background:rgba(10,8,6,.5);justify-self:start;max-width:100%}.ob.now{opacity:1;border-left-color:var(--glow)}
.ob .obh{font-size:.68em;color:var(--glow);letter-spacing:.04em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ob .obh b{font-family:var(--display);font-size:1.25em}.ob .obh span{color:var(--muted)}
body.op .sub .ob p{font-size:1em;line-height:1.45;white-space:pre-wrap}body.op .sub .ln .pn{font-size:.7em}
body.op .sub.lines .ob:not(.now) .ln{opacity:.8}
@media (max-width:760px){.orh span,.orh em{display:none}.opg{padding:10px}.ob .obh span{display:none}}
.sub .ln{pointer-events:auto;cursor:pointer;display:inline-block;position:relative}
.ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#pad{position:fixed;inset:0;z-index:15;touch-action:none;cursor:crosshair}
.pentools{position:fixed;z-index:16;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;align-items:center;background:rgba(20,16,12,.85);border:1px solid var(--line);border-radius:99px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.pentools button{background:none;border:1px solid transparent;color:var(--ink);border-radius:99px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.pentools button.on{border-color:var(--glow)}
.pentools i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}
body.drawing .foot,body.drawing .player,body.drawing .hint{display:none}
@media (max-width:640px){.pentools{left:10px;right:10px;transform:none;flex-wrap:wrap;justify-content:center;border-radius:18px}.pentools button{white-space:nowrap;padding:6px 8px}}
.ln.hl,.toc .l.hl{background:linear-gradient(transparent 35%,rgba(240,140,80,.45) 35%,rgba(240,140,80,.45) 92%,transparent 92%);border-radius:3px}
.ln.x,.toc .l.x{text-decoration:line-through;text-decoration-color:rgba(255,120,110,.9);text-decoration-thickness:2px}
.ln .pn,.toc .l .pn{font-family:var(--body);font-size:12px;color:var(--glow);opacity:.9;margin-left:8px;letter-spacing:0;text-shadow:0 1px 6px #000;white-space:nowrap}
.ln .nt,.toc .l .nt{font-family:var(--body);font-size:12.5px;color:#ffb48a;margin-left:8px;letter-spacing:0;text-shadow:0 1px 6px #000}
.toc .row{display:flex;align-items:center;gap:4px}.toc .row .l{flex:1}
.toc.tg .tgrid{display:grid;gap:26px 40px;align-items:start;padding:8px 8px 20px;max-width:1400px;margin:0 auto}
.toc.tg .sec{max-width:none;margin:0}
.toc.tg .sec.now{box-shadow:-10px 0 0 -8px var(--glow)}
.toc.tg .sec>button{font-size:11.5px;padding:0 0 4px}.toc.tg .sec>button b{font-size:13px}
.toc.tg .l{font-size:16.5px;line-height:1.7;padding:2px 8px;white-space:pre-wrap}
.toc .pen{border:0;background:none;color:var(--muted);font-size:15px;padding:6px 8px}
/* 架構表：一頁看完整首歌的骨架 */
.map{max-width:680px;margin:0 auto}
.map .chain{font-family:var(--display);font-size:24px;line-height:1.6;color:var(--glow);margin:2px 0 4px;display:flex;flex-wrap:wrap;column-gap:.7em}.map .chain span{white-space:nowrap}
.map .tip{color:var(--muted);font-size:13px;margin:0 0 14px}
.map .mp{display:grid;grid-template-columns:22px 64px minmax(40px,auto) 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.map .mp.newsec{border-top-color:rgba(242,194,123,.45)}
.map .mn{color:var(--muted);font-size:12px;text-align:right}
.map .ms{color:var(--glow);font-size:13px;letter-spacing:.06em}
.map .mw{font-family:var(--display);font-size:28px;text-align:center;white-space:nowrap}
.map .mc{font-size:14px;line-height:1.45}
.map .mf{font-family:var(--display);font-size:13px;color:var(--muted);margin-top:2px}
.map .mp>button{padding:6px 12px;font-size:13px}
.map .mp.hide .mw,.map .mp.hide .mc,.map .mp.hide .mf{filter:blur(9px);opacity:.5}
.map .mp.hide{cursor:pointer}
.map .mp.next .mn::after{content:'？';color:var(--glow)}
.toc .top button.on{border-color:var(--glow);color:var(--glow)}
@media (max-width:560px){.map .mp{grid-template-columns:18px 58px minmax(32px,auto) 1fr;gap:8px}.map .ms{font-size:12px;letter-spacing:0}.map .mp>button{display:none}.map .mw{font-size:24px}.map .chain{font-size:20px}}
.sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#1a1612;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:10px;max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet .q{font-family:var(--display);font-size:17px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet button{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.sheet button.on{border-color:var(--glow);color:var(--glow)}
.sheet input{width:100%;box-sizing:border-box;background:rgba(0,0,0,.4);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px var(--body)}
.paste{position:relative;z-index:5;display:grid;gap:8px;margin:0 auto;max-width:560px;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 40px}
.paste{pointer-events:none}.paste>*{pointer-events:auto}
.paste p{margin:0;color:var(--ink);font-size:14px;line-height:1.6;text-shadow:0 1px 6px #000}
.paste textarea{width:100%;min-height:50vh;background:rgba(15,12,9,.82);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.6 var(--body)}
.paste .row{display:flex;gap:8px;justify-content:flex-end}
.btn{background:var(--glow);color:#1a120a;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:rgba(0,0,0,.5);color:var(--muted);border:1px solid var(--line)}
.empty{position:relative;z-index:5;padding:40vh 0;text-align:center;color:var(--muted)}
/* ---------- 播放介面：下面一條播放列，平常用不到的收進右上角「⋯」 ---------- */
.foot{display:none}
.bar{align-items:center}
.bar .keyc{margin-left:6px;color:#ffd36b;font-weight:600}.keyc:empty{display:none}.keyseg b{min-width:4.2em;text-align:center;font-weight:600}
.pgh{margin:10px 2px 6px;color:var(--glow);font-size:13px;font-weight:600}.pgh small{margin-left:8px;color:var(--muted);font-weight:400;font-size:11px}
@media (min-width:700px){.menu-sheet .pgl{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
.pgl .pgt{white-space:nowrap}.menu-sheet .pgl small{text-align:right}
.ngrid{display:grid;grid-template-columns:2.8em repeat(4,1fr);gap:8px;align-items:stretch}.nh{font-size:12px;color:var(--ink);text-align:center;font-weight:600}.nh small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}.nl{font-size:12px;color:var(--muted);align-self:center}
#menu .nc.gone{opacity:.55;border-style:dashed;background:none}#menu .nc.gone s{font-size:12px;color:var(--muted);text-decoration-color:rgba(255,120,110,.8)}
.nh em{display:block;font-style:normal;font-size:10px;color:var(--glow);font-weight:400;margin-top:2px;line-height:1.3}
#menu .nc{position:relative}
#menu .nc .vk{position:absolute;top:6px;right:6px;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:99px;border:1px dashed rgba(242,194,123,.5);color:var(--glow)}
#menu .nc .vk.on{border-style:solid;background:rgba(242,194,123,.18)}#menu .nc .vk.grad{border:0;background:none;font-size:15px;padding:0}
#menu .nc .vk.vt{box-shadow:0 0 0 2px rgba(242,194,123,.45)}
.nnote{margin:8px 0 4px;font-size:11.5px;line-height:1.6;color:var(--muted)}
#menu .nc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:inherit;min-width:0}
#menu .nc small{font-size:11px;color:var(--muted);line-height:1.3;text-align:left}

const LKEY='scene-lyrics-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function loadLyrics(){try{return (JSON.parse(localStorage.getItem(LKEY)||'{}')||{})[key]||''}catch(e){return ''}}
function saveLyrics(t){let all={};try{all=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){}all[key]=t;try{localStorage.setItem(LKEY,JSON.stringify(all))}catch(e){alert('這台裝置沒辦法存歌詞')}}
// 依每段行數切歌詞（略過空行和分隔線）；多出來的行併到最後一段
// 歌詞裡空一行＝換段：空出來的段數剛好等於這首的段數，就照你空的分；不然照預設每段幾行
function groupsOf(text){const g=[];let c=[];text.split(/\r?\n/).map(s=>s.trim()).forEach(l=>{if(!l||/^[-—=_~*·.]+$/.test(l)){if(c.length){g.push(c);c=[]}}else c.push(l)});if(c.length)g.push(c);return g}
// 你空行分出的段數跟預設不一樣：每一段變成一頁，沿用它落在預設哪一段的圖點和提示字（已經對過拍、段數不合的舊歌照舊）
function stepsFor(sc,text){
  const base=sc.base||(sc.base=sc.steps);const g=text?groupsOf(text):[];const rt=rawTimes();
  if(g.length<2||g.length===base.length||(rt.length>1&&rt.length===base.length))return base;
  const ends=[];let c=0;base.forEach(s=>{c+=s.n;ends.push(c)});const tot=g.reduce((a,b)=>a+b.length,0);let at=0;
  return g.map(b=>{const m=(at+b.length/2)/tot*c;at+=b.length;let k=ends.findIndex(e=>m<e);if(k<0)k=base.length-1;return Object.assign({},base[k],{n:b.length})});
}
function split(text,steps){
  const g=groupsOf(text);if(g.length===steps.length)return g;
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^[-—=_~*·.]+$/.test(s));let i=0;
  return steps.map((s,k)=>{const take=k===steps.length-1?lines.length-i:s.n;const L=lines.slice(i,i+take);i+=take;return L});
}
// 畫面正上方一條：整首歌的段落，照每段長短分格（段落・一個字・小字情境），唱到哪格亮哪格，點格子跳段
function chainHtml(sc){const t=getTimes(),n=sc.steps.length,d=[];
  for(let i=0;i<n;i++)d.push(t[i]!=null&&t[i+1]!=null?t[i+1]-t[i]:null);
  const ok=d.filter(x=>x>0),avg=ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:1,w=i=>d[i]>0?d[i]:avg;
  const btn=i=>{const st=sc.steps[i];return `<button data-act="chain" data-i="${i}" style="flex:${w(i).toFixed(1)} 1 0" title="${esc(st.sec)}・${esc(st.cue||'')}"><span class="cw"><b>${esc(st.word)}</b><em>${esc(st.sec)}</em></span><small class="co">${esc(namesOf(sc,st))}</small><small>${esc(st.cue||'')}</small></button>`};
  // 一頁排版的欄＝輪：上面加一條輪次標籤，跨過那一輪的段落
  let pos=null;try{if(blocks&&blocks.length===n)pos=tocGrid()}catch(e){}
  const C=pos?Math.max(...pos.map(p=>p.c))+1:1;
  if(C<2)return `<div class="chainbar" id="chainbar" aria-label="整首架構">${sc.steps.map((_,i)=>btn(i)).join('')}</div>`;
  const g=[];pos.forEach((p,i)=>{(g[p.c]=g[p.c]||[]).push(i)});
  return `<div class="chainbar grp" id="chainbar" aria-label="整首架構">${g.map((L,c)=>{const r=sc.rounds&&sc.rounds[c];return `<div class="cg" style="flex:${onePage()?1:L.reduce((a,i)=>a+w(i),0).toFixed(1)} 1 0"><div class="cgl"><b>${r?esc(r.t):`第${c+1}輪`}</b>${r?`<span>${esc(r.s)}</span>`:''}</div><div class="cgr">${L.map(btn).join('')}</div></div>`}).join('')}</div>`}
// 星空後製：固定的假亂數，星星每次位置都一樣
function starsHtml(sc){
  if(!sc.stars)return '';let seed=7,h='';const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  sc.stars.forEach(([x0,y0,x1,y1])=>{const n=Math.round((x1-x0)*(y1-y0)/9);for(let k=0;k<n;k++){const sz=r()<.15?3:2;
    h+=`<i style="left:${(x0+r()*(x1-x0)).toFixed(2)}%;top:${(y0+r()*(y1-y0)).toFixed(2)}%;width:${sz}px;height:${sz}px;animation-delay:${(r()*3).toFixed(2)}s"></i>`}});
  return `<div class="stars" id="stars">${h}</div>`;
}

// 圖固定不動。橫的螢幕：鋪滿（像 object-fit:cover）置中；直的手機：整張寬度放在上面，背後用同一張圖模糊鋪滿

function place(){
  const sc=SCENES[key],bg=document.getElementById('bg');if(!bg)return;

  else{W=Math.max(vw,vh*sc.ratio);H=W/sc.ratio;tx=(vw-W)/2;ty=(vh-H)/2}
  bg.style.width=W+'px';bg.style.height=H+'px';bg.style.transform=`translate(${tx}px,${ty}px)`;
  document.documentElement.style.setProperty('--img-bottom',(ty+H)+'px');

// 換到第 i 段：亮這段提到的東西，顯示這段歌詞和下一段的開頭

  const stz=document.getElementById('stars');if(stz)stz.classList.toggle('on',ks.includes('stars'));
  document.querySelectorAll('.spot').forEach(el=>{const on=ks.includes(el.dataset.spot);el.classList.toggle('on',on);el.classList.toggle('dim',!on)});
  const sub=document.getElementById('sub');
  if(sub&&blocks&&onePage()){
    // 一頁排版：整首歌疊在情境圖上，重複的段落對齊同一列（同 ☰ 一頁），唱到哪段亮哪段
    const pos=tocGrid(),C=Math.max(...pos.map(p=>p.c))+1;let o=0;
    const tb=document.querySelector('.bar');if(tb)sub.style.top=(tb.getBoundingClientRect().bottom+8)+'px';

    sub.innerHTML=`<div class="opg" style="grid-template-columns:repeat(${C},minmax(0,1fr))">${R?R.map((x,c)=>`<div class="orh${pos[cur].c===c?' now':''}" style="grid-column:${c+1};grid-row:1"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></div>`).join(''):''}${sc.steps.map((x,i)=>{const ls=blocks[i]||[];const h=`<div class="ob${i===cur?' now':''}" style="grid-column:${pos[i].c+1};grid-row:${pos[i].r+1+dr}"><div class="obh">${esc(x.sec)} <b>${esc(x.word)}</b> <span>${esc(namesOf(sc,x))}</span></div><p>${ls.map((l,k)=>lnHtml(l,o+k)).join('<br>')}</p></div>`;o+=ls.length;return h}).join('')}</div>`;
    lightLine();opFit();opSpots(sc,ks);
  }else if(sub&&blocks){sub.style.top='';opSpots(null);
    const nx=sc.steps[cur+1];
    const off=blocks.slice(0,cur).reduce((a,b)=>a+b.length,0);
    sub.innerHTML=`<div class="cue">${esc(st.sec)}<b>${esc(namesOf(sc,st))} ${esc(st.word)}</b><span>${esc(st.cue)}</span></div><p class="cur">${(blocks[cur]||[]).map((l,k)=>lnHtml(l,off+k)).join('<br>')}</p>`+(nx?`<div class="next"><small>下一段・${esc(namesOf(sc,nx))} ${esc(nx.word)}</small><p>${(blocks[cur+1]||[]).slice(0,2).map((l,k)=>`<span class="ln2" data-l="${off+(blocks[cur]||[]).length+k}">${esc(l)}</span>`).join('<br>')}</p></div>`:'<div class="next"><small>最後一段</small></div>');
    if(anim){sub.classList.remove('swap');sub.offsetWidth;sub.classList.add('swap')}
  }
  const c=document.getElementById('count');if(c)c.textContent=`${cur+1} / ${n}`;
  if(typeof au!=='undefined')drawPlayer();

/* ---------- 伴奏：檔案存在這台裝置（IndexedDB），不會上傳 ---------- */
// 對拍：播放時每到下一段點一下，記下每段開始的秒數；之後播放就自動換段
const TKEY='scene-times-v1';
let au=null,auUrl='',rec=false,track='inst',have={inst:false,orig:false};
const TRACK={inst:'伴奏',orig:'原曲',vocal:'人聲'};let hasVocal=false;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('scene-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function getFile(k){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('files').objectStore('files').get(k);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function delFile(k){try{const db=await idb();db.transaction('files','readwrite').objectStore('files').delete(k)}catch(e){}}
async function putFile(k,f){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(f,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
// 原曲和伴奏常常不是同一個來源，開頭長度不一樣：記下「對拍是用哪一軌對的」和「伴奏比原曲晚幾秒」，換軌播放時自動加減
const kv=(k,v)=>{let all={};try{all=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){}if(v===undefined)return all[key];all[key]=v;try{localStorage.setItem(k,JSON.stringify(all))}catch(e){}};
const getBase=()=>kv('scene-base-v1')||'orig',setBase=v=>kv('scene-base-v1',v);
const getOff=()=>+kv('scene-off-v1')||0;
const shiftFor=tr=>tr===getBase()?0:tr==='inst'?getOff():-getOff();
const r2=x=>Math.round(x*100)/100;
const conv=(a,d)=>d?a.map(x=>x==null?x:r2(Math.max(0,x+d))):a;
function rawTimes(){try{return (JSON.parse(localStorage.getItem(TKEY)||'{}')||{})[key]||[]}catch(e){return []}}
function rawSetTimes(a){let all={};try{all=JSON.parse(localStorage.getItem(TKEY)||'{}')||{}}catch(e){}all[key]=a;try{localStorage.setItem(TKEY,JSON.stringify(all))}catch(e){}}
function getTimes(tr){return conv(rawTimes(),shiftFor(tr||track))}
function setTimes(a,tr){rawSetTimes(conv(a,-shiftFor(tr||track)))}
const LNKEY='scene-lines-v1';
function rawLines(){try{return (JSON.parse(localStorage.getItem(LNKEY)||'{}')||{})[key]||[]}catch(e){return []}}
function rawSetLines(a){let all={};try{all=JSON.parse(localStorage.getItem(LNKEY)||'{}')||{}}catch(e){}all[key]=a;try{localStorage.setItem(LNKEY,JSON.stringify(all))}catch(e){}}
function getLines(tr){return conv(rawLines(),shiftFor(tr||track))}
function setLines(a,tr){rawSetLines(conv(a,-shiftFor(tr||track)))}
// 復原：重對、自動對之前先把這首原本的時間存一份，歌詞表裡可以換回來
const UKEY='scene-undo-v1';
function getUndo(){try{return (JSON.parse(localStorage.getItem(UKEY)||'{}')||{})[key]||null}catch(e){return null}}
function snapshot(){const t=rawTimes(),L=rawLines();if(t.length<2&&!L.length)return;let all={};try{all=JSON.parse(localStorage.getItem(UKEY)||'{}')||{}}catch(e){}all[key]={t,L,at:Date.now()};try{localStorage.setItem(UKEY,JSON.stringify(all))}catch(e){}}
function undoTimes(){const u=getUndo();if(!u)return;if(!confirm('換回上一次的對拍？（現在的會變成可以再換回來的那份）'))return;const cur0={t:rawTimes(),L:rawLines(),at:Date.now()};rawSetTimes(u.t);rawSetLines(u.L);let all={};try{all=JSON.parse(localStorage.getItem(UKEY)||'{}')||{}}catch(e){}all[key]=cur0;try{localStorage.setItem(UKEY,JSON.stringify(all))}catch(e){}closeToc();show(cur);drawPlayer();hint('換回來了');hintT=setTimeout(()=>hint(''),2000)}
const mmss=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
let hintT=0;
function hint(t){clearTimeout(hintT);const h=document.getElementById('hint');if(!h)return;h.hidden=!t;h.textContent=t||''}
// 伴奏和原唱各存一份；對拍秒數兩個共用（同一個錄音分出來的，時間一樣）
let loadGen=0;
async function loadAudio(want,at,play){
  const gen=++loadGen;
  const fi=await getFile(key+'|inst')||await getFile(key),fo=await getFile(key+'|orig');
  have={inst:!!fi,orig:!!fo};await loadTakes();hasVocal=!!await getFile(key+'|vocal');
  if(hasVocal&&!getLines().length&&!loadAudio.did){loadAudio.did=1;autoAlign()}  // 之前放過人聲：補算逐句一次
  try{track=want||localStorage.getItem('scene-track')||'inst'}catch(e){track=want||'inst'}
  if(!have[track])track=have.inst?'inst':'orig';
  const f0=track==='inst'?fi:fo;if(!f0){drawPlayer();return}
  if(fi&&fo&&!kv('scene-offat-v1'))setTimeout(()=>findOffset(fi,fo),1500);
  if(au)au.pause();
  // 原曲、伴奏兩軌都解開，用同一個 Web Audio 時鐘一起播；換軌只是換哪一軌有聲音（跟錄音室一樣，沒有切點）
  const k0=key,bufs={};
  for(const tr of ['inst','orig']){const f1=tr==='inst'?fi:fo;if(!f1)continue;
    try{bufs[tr]=await decodeHead(await playable(key+'|'+tr,f1,typeof S!=='undefined'&&S?sMsg:hint,gen))}catch(e){if(e==='stale')return}
    if(gen!==loadGen)return}
  if(key!==k0||gen!==loadGen)return;
  if(au)au.pause();
  if(!bufs[track]){drawPlayer();return}
  au=new Player(bufs,track);hookAu();
  au.addEventListener('timeupdate',sync);au.addEventListener('play',wakePlayer);au.addEventListener('pause',wakePlayer);au.addEventListener('play',drawPlayer);au.addEventListener('pause',()=>{drawPlayer();lightLine()});
  au.addEventListener('ended',()=>{if(rec)toggleRec();drawPlayer()});au.addEventListener('loadedmetadata',()=>{if(at)au.currentTime=at;if(play)au.play();drawPlayer()});
  drawPlayer();
}
// 播放列：上面進度條（黃色小刻度＝每段開始，可以拖），下面 原曲｜伴奏、⏮ ▶ ⏭、畫筆、整首歌詞
function drawPlayer(){
  const ctl=document.getElementById('ctl'),rail=document.getElementById('rail');if(!ctl||!rail)return;
  const sc=SCENES[key],n=sc.steps.length,t=getTimes(),dur=au&&isFinite(au.duration)?au.duration:0;
  document.getElementById('prog').classList.toggle('off',!au);
  rail.innerHTML=(dur?t.map((x,i)=>x!=null&&i>0?`<i class="tick${i===cur?' on':''}" style="left:${(x/dur*100).toFixed(2)}%"></i>`:'').join(''):'')+'<b class="fill" id="pfill"></b><b class="knob" id="pknob"></b>';
  if(rec){ctl.innerHTML=`<div class="recbar"><b>● 對拍中</b><span>唱到每句開頭點一下螢幕</span><button data-act="rback">↶ 退一句</button><button data-act="rec" class="done">完成</button></div>`;updateProg();return}
  const sw=au?(have.inst&&have.orig?`<div class="seg" role="group" aria-label="原曲或伴奏"><button data-act="track" data-to="orig" class="${track==='orig'?'on':''}">原曲</button><button data-act="track" data-to="inst" class="${track==='inst'?'on':''}">伴奏</button></div>`:`<span class="lab">${TRACK[track]}</span>`):'';
  const mid=`<button data-act="prev" aria-label="倒退 5 秒" class="sk">${au?'↺5':'⏮'}</button>`+(au?`<button data-act="play" class="pp" aria-label="${au.paused?'播放':'暫停'}">${au.paused?'▶':'❚❚'}</button>`:`<button data-act="menu" class="add">＋ 放音樂</button>`)+`<button data-act="next" aria-label="快轉 5 秒" class="sk">${au?'5↻':'⏭'}</button>`;
  const chips=au?`<button data-act="loop" class="chip${loopSec>=0?' on':''}" aria-label="重複這段">🔁</button><span class="kbar" role="group" aria-label="升降 Key"><button data-act="key" data-d="-1" aria-label="降半音">−</button><b id="keyb">${keyHtml(getKey())}</b><button data-act="key" data-d="1" aria-label="升半音">＋</button></span>`:'';
  ctl.innerHTML=`<div class="l">${sw}${chips}<span class="cnt">${cur+1} / ${n}</span></div><div class="c">${mid}</div><div class="r">${au?'<button data-act="plhide" aria-label="收起播放列" class="plh">⌄</button><button data-act="mic" aria-label="錄音" class="micb">🎙</button>':''}<button data-act="pen" aria-label="畫筆">✏️</button><button data-act="toc" aria-label="整首歌詞">☰</button></div>`;
  updateProg();
}
function updateProg(){

// 從第 l 句播（早 0.5 秒進）或從第 sec 段播；都沒給就從頭
function playFrom(sec,l){
  if(rec)return;const t=getTimes(),L=getLines();let at=0,s=0;
  if(l!=null){s=secOfLine(l);at=L[l]!=null?Math.max(0,L[l]-.5):(t[s]||0)}
  else if(sec!=null){s=sec;at=t[sec]||0}
  browsing=0;show(s);if(!au){hint('先放原曲或伴奏才能播');hintT=setTimeout(()=>hint(''),2500);return}
  au.currentTime=at;au.play();
}
// 整首歌詞：一頁排版（像她的 GoodNotes）—— 一段接一段往下排；回到唱過的段落（第一句一樣）就換到下一欄、對齊原本那一列，
// 所以同樣的旋律永遠在同一列；同一段連續重複就往下接
// 有 mel（照簡譜標的旋律代號）就照旋律對齊，沒有就比第一句歌詞
function tocGrid(){const nm=x=>String(x||'').replace(/[\s，。、！？,.!?~～…「」]/g,''),pos=[],orig=[];let c=0,last=-1;
  const mel=SCENES[key].mel,id=i=>mel&&mel.length===blocks.length?mel[i]:nm(blocks[i][0]);
  blocks.forEach((ls,i)=>{const f=id(i);let m=-1;if(f)for(let j=0;j<i;j++)if(id(j)===f){m=j;break}
    let r;if(m<0){r=last+1;orig[i]=i}else{orig[i]=orig[m];const tgt=pos[orig[m]].r;
      if(i&&orig[i-1]===orig[i])r=last+1;else if(tgt<=last){c++;r=tgt}else r=tgt}
    pos[i]={c,r};last=r});return pos}
let tocMode=null;
// 一頁排版：現在這段的代表物複製一份浮在歌詞上面（圖層在歌詞下面，會被擋住）
function opSpots(sc,ks){let o=document.getElementById('opspots');if(!sc){if(o)o.remove();return}
  const bg=document.getElementById('bg');if(!bg)return;if(!o){o=document.createElement('div');o.id='opspots';app.appendChild(o)}
  o.style.cssText=`width:${bg.style.width};height:${bg.style.height};transform:${bg.style.transform}`;
  o.innerHTML=ks.map(k=>{const p=sc.spots[k];return p?`<div class="spot on" style="left:${p.x}%;top:${p.y}%"><i></i><b>${esc(p.name)}</b></div>`:''}).join('')}
// 一頁排版自動縮字：整首放得進畫面為止（不用滑）
function opFit(){const sub=document.getElementById('sub'),g=sub&&sub.querySelector('.opg');if(!g)return;let f=17;g.style.fontSize=f+'px';
  while(f>10&&sub.scrollHeight>sub.clientHeight+1){f-=.5;g.style.fontSize=f+'px'}}
addEventListener('resize',()=>{if(document.body.classList.contains('op'))setTimeout(()=>show(cur,false),100)});
const onePage=()=>{let v=null;try{v=localStorage.getItem('scene-op-v1')}catch(e){}return v?v==='1':innerWidth>=700};
function openToc(){
  if(!blocks)return;closeToc();const sc=SCENES[key],t=getTimes(),L=getLines();let o=0;
  if(!tocMode){try{tocMode=localStorage.getItem('scene-tocmode-v1')}catch(e){}if(!tocMode)tocMode=innerWidth>=700?'grid':'list'}
  const grid=tocMode==='grid',pos=grid?tocGrid():null,C=grid?Math.max(...pos.map(p=>p.c))+1:1;
  const d=document.createElement('div');d.className='toc'+(grid?' tg':'');d.id='toc';
  d.innerHTML=`<div class="top"><b>${esc(sc.title)}</b><button data-act="tocmode">${grid?'清單':'一頁'}</button><button data-act="map">架構表</button><button data-act="from">▶ 從頭播</button>${getUndo()?'<button data-act="undo">↶ 復原對拍</button>':''}<button data-act="tocx">關閉</button></div>`+
    (grid?`<div class="tgrid" style="grid-template-columns:repeat(${C},minmax(230px,1fr))">`:'')+
    sc.steps.map((st,i)=>{const ls=blocks[i]||[];const h=`<div class="sec${i===cur?' now':''}"${grid?` style="grid-column:${pos[i].c+1};grid-row:${pos[i].r+1}"`:''}><button data-act="from" data-sec="${i}">${esc(st.sec)}<b>${esc(namesOf(sc,st))} ${esc(st.word)}</b>${t[i]!=null?mmss(t[i]):''} ▶</button>`+
      ls.map((x,k)=>{const j=o+k,m=noteOf(j);return `<div class="row"><button class="l${i===cur?' cur':''}${m.hl?' hl':''}${m.x?' x':''}" data-act="from" data-l="${j}">${esc(x)}${m.t?`<span class="nt">${esc(m.t)}</span>`:''}${pNote(j)?`<span class="pn">${esc(pNote(j))}</span>`:''}${L[j]!=null?`<small>${mmss(L[j])}</small>`:''}</button>${grid?'':`<button class="pen" data-act="note" data-l="${j}" aria-label="這句做筆記">✎</button>`}</div>`}).join('')+'</div>';o+=ls.length;return h}).join('')+(grid?'</div>':'');
  app.appendChild(d);
  if(!grid){const c=d.querySelector('.l.cur');if(c)c.scrollIntoView({block:'center'})}
}
function closeToc(){const d=document.getElementById('toc');if(d)d.remove()}
// 架構表：整首歌一頁看完（段落、一個字、情境、第一句開頭）。「回想」＝先蓋起來，自己說出下一段是什麼再點開
let mapRecall=false,mapShown=0;
function openMap(){
  closeToc();const sc=SCENES[key],t=getTimes();
  const first=i=>{const l=(blocks&&blocks[i]||[])[0]||'';return l.length>12?l.slice(0,12)+'…':l};
  const d=document.createElement('div');d.className='toc';d.id='toc';
  d.innerHTML=`<div class="top"><b>${esc(sc.title)}・架構表</b><button data-act="mapr" class="${mapRecall?'on':''}">${mapRecall?'回想中':'回想'}</button>${blocks?'<button data-act="toc">歌詞</button>':''}<button data-act="tocx">關閉</button></div>
  <div class="map"><div class="chain">${sc.steps.map(st=>`<span>${esc(st.word)}</span>`).join('')}</div>
  <p class="tip">${mapRecall?'先別看：說出下一段的段落、情境和第一句，再點那一列確認。':'先把上面這串字記起來，就是整首歌的順序；每個字背後是一個畫面。'}</p>
  ${sc.steps.map((st,i)=>{const hide=mapRecall&&i>mapShown;return `<div class="mp${i&&st.sec!==sc.steps[i-1].sec?' newsec':''}${hide?' hide':''}${mapRecall&&i===mapShown+1?' next':''}"${hide?` data-act="mapx" data-i="${i}"`:''}>
    <span class="mn">${i+1}</span><span class="ms">${esc(st.sec)}</span><b class="mw">${esc(st.word)}</b>
    <div><div class="mc">${esc(namesOf(sc,st))}｜${esc(st.cue||'')}</div>${first(i)?`<div class="mf">${esc(first(i))}</div>`:''}</div>
    <button data-act="from" data-sec="${i}">${t[i]!=null?mmss(t[i])+' ':''}▶</button></div>`}).join('')}</div>`;
  app.appendChild(d);
}
// 在圖上左右滑：換段（正在播就跳到那段）
// 上下滑：翻歌詞找位置（音樂不跳），找到後點那一句就從那句播；8 秒沒動作就回到正在唱的地方
let tx0=null,browsing=0,lpT=0,lpFired=false,lp0=null;
// 長按一句歌詞：打開這句的工具（螢光筆、劃掉、小字、從這句改對拍）
app.addEventListener('pointerdown',e=>{const ln=e.target.closest('.sub .ln');lpFired=false;if(!ln||rec||document.body.classList.contains('studio-big'))return;lp0=[e.clientX,e.clientY];clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;openNote(+ln.dataset.l)},550)});
app.addEventListener('pointermove',e=>{if(lp0&&Math.hypot(e.clientX-lp0[0],e.clientY-lp0[1])>10){clearTimeout(lpT);lp0=null}});
['pointerup','pointercancel'].forEach(t=>app.addEventListener(t,()=>{clearTimeout(lpT);lp0=null}));
app.addEventListener('contextmenu',e=>{if(e.target.closest('.sub'))e.preventDefault()});
function browse(i){const n=SCENES[key].steps.length;if(i<0||i>=n)return;browsing=Date.now();show(i);hint('點一句，就從那句開始播');hintT=setTimeout(()=>hint(''),1800)}
app.addEventListener('touchstart',e=>{if(e.target.id==='tap'||e.target.closest('.sub'))tx0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
app.addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0[0],dy=e.changedTouches[0].clientY-tx0[1];tx0=null;if(rec||document.getElementById('pad'))return;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();step(dx<0?cur+1:cur-1)}
  else if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.2){e.preventDefault();browse(dy<0?cur+1:cur-1)}});
let wheelT=0;
app.addEventListener('wheel',e=>{if(document.getElementById('studio')||rec||!document.body.classList.contains('play')||document.getElementById('toc'))return;if(Date.now()-wheelT<450||Math.abs(e.deltaY)<20)return;wheelT=Date.now();browse(e.deltaY>0?cur+1:cur-1)},{passive:true});
/* ---------- 筆記：每句可以上螢光筆、劃掉、寫一句小字，播放時跟著歌詞出來 ---------- */
// 用「那句歌詞＋第幾次出現」當鑰匙，之後補歌詞、插行，筆記也不會跑到別句
const NKEY='scene-notes-v1';let noteL=-1;
function lineKey(j){const all=blocks.flat(),x=all[j];let n=0;for(let i=0;i<j;i++)if(all[i]===x)n++;return x+'#'+n}
function allNotes(){try{return JSON.parse(localStorage.getItem(NKEY)||'{}')||{}}catch(e){return {}}}
function noteOf(j){if(!blocks)return {};return Object.assign({},(allNotes()[key]||{})[lineKey(j)]||{})}
function saveNote(j,m){const a=allNotes(),o=a[key]||(a[key]={}),k=lineKey(j);if(m.hl||m.x||m.t)o[k]=m;else delete o[k];try{localStorage.setItem(NKEY,JSON.stringify(a))}catch(e){}refreshNotes()}
// 我寫的唱法筆記（SCENES[key].lnotes，段:句）→ 第 j 句
function pNote(j){const N=SCENES[key].lnotes;if(!N||!blocks||blocks.length!==SCENES[key].steps.length)return '';let o=0;for(let i=0;i<blocks.length;i++){const n=blocks[i].length;if(j<o+n)return N[i+':'+(j-o)]||'';o+=n}return ''}
function lnHtml(l,j){const m=noteOf(j),p=pNote(j);return `<span class="ln${m.hl?' hl':''}${m.x?' x':''}" data-l="${j}">${esc(l)}${m.t?`<span class="nt">${esc(m.t)}</span>`:''}${p?`<span class="pn">${esc(p)}</span>`:''}</span>`}
function refreshNotes(){const on=document.getElementById('toc');show(cur,false);lightLine();if(on){const y=on.scrollTop;openToc();document.getElementById('toc').scrollTop=y}}
function openNote(j){
  closeNote();noteL=j;const m=noteOf(j),d=document.createElement('div');d.className='sheet';d.id='sheet';
  d.innerHTML=`<div class="q">${esc(blocks.flat()[j])}</div><div class="row"><button data-act="nhl" class="${m.hl?'on':''}">🖍 螢光筆</button><button data-act="nx" class="${m.x?'on':''}">劃掉</button><button data-act="nclr">清除</button>${au?'<button data-act="nline">⏱ 從這句改對拍</button>':''}</div><input id="nt-in" placeholder="寫一句提醒，例如：換氣、放輕、笑著唱" value="${esc(m.t||'')}"><div class="row" style="justify-content:flex-end"><button data-act="ndone">完成</button></div>`;
  app.appendChild(d);
}
function closeNote(){const d=document.getElementById('sheet');if(d)d.remove()}
/* ---------- 畫筆：用 Apple Pencil 或手指直接在歌詞上畫，畫的東西黏在最近的那句，跟著歌詞跑 ---------- */
// 座標用那句字的大小（em）來記，換 iPad／手機、字放大縮小都還是畫在同一個位置
const IKEY='scene-ink-v1',PENS=[{n:'紅',c:'#ff6b5b',w:.09,o:1},{n:'藍',c:'#6fb3ff',w:.09,o:1},{n:'螢光',c:'#ffd84d',w:.55,o:.4}];
let pen=0,inkHist=[];
function allInk(){try{return JSON.parse(localStorage.getItem(IKEY)||'{}')||{}}catch(e){return {}}}
function saveInk(a){try{localStorage.setItem(IKEY,JSON.stringify(a))}catch(e){}}
function drawInk(){
  if(!blocks)return;const mine=allInk()[key]||{};
  document.querySelectorAll('.sub .ln').forEach(el=>{
    const old=el.querySelector('.ink');if(old)old.remove();
    const st=mine[lineKey(+el.dataset.l)];if(!st||!st.length)return;
    const fs=parseFloat(getComputedStyle(el).fontSize)||20;
    el.insertAdjacentHTML('beforeend',`<svg class="ink">${st.map(k=>strokeSvg(k,fs)).join('')}</svg>`);
  });
}
// 有壓力（Apple Pencil）的筆畫：每一小段照當時的力道決定粗細；螢光筆和舊的筆畫一樣粗
const pw=(P,q,fs)=>P.w*fs*(P.o<1||q[2]==null?1:.35+1.3*q[2]);
function strokeSvg(k,fs){
  const P=PENS[k.c]||PENS[0],X=q=>(q[0]*fs).toFixed(1),Y=q=>(q[1]*fs).toFixed(1);
  if(P.o<1||k.p.length<2||k.p[0][2]==null)return `<path d="${k.p.map((q,i)=>(i?'L':'M')+X(q)+' '+Y(q)).join('')}" stroke="${P.c}" stroke-width="${(P.w*fs).toFixed(1)}" stroke-opacity="${P.o}"/>`;
  let o='';for(let i=1;i<k.p.length;i++){const a=k.p[i-1],b=k.p[i];o+=`<path d="M${X(a)} ${Y(a)}L${X(b)} ${Y(b)}" stroke="${P.c}" stroke-width="${pw(P,[0,0,(a[2]+b[2])/2],fs).toFixed(2)}"/>`}
  return o;
}
function drawTools(){
  const t=document.getElementById('pentools');if(!t)return;
  t.innerHTML=PENS.map((P,i)=>`<button data-act="pcol" data-i="${i}" class="${i===pen?'on':''}"><i style="background:${P.c};opacity:${P.o<1?.7:1}"></i> ${P.n}</button>`).join('')+`<button data-act="pcol" data-i="-1" class="${pen<0?'on':''}">◻︎ 橡皮擦</button><button data-act="pprev" aria-label="上一段">‹</button><button data-act="pnext" aria-label="下一段">›</button><button data-act="pundo">↶ 上一筆</button><button data-act="pclr">清這段</button><button data-act="pdone">完成</button>`;
}
function startDraw(){
  if(!blocks||document.getElementById('pad'))return;if(au&&!au.paused)au.pause();
  document.body.classList.add('drawing');inkHist=[];
  app.insertAdjacentHTML('beforeend','<canvas id="pad"></canvas><div class="pentools" id="pentools"></div>');drawTools();
  const cv=document.getElementById('pad'),dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineCap='round';g.lineJoin='round';
  let pts=null,fs0=20,id0=null;
  // 力道：Apple Pencil 用真的壓力；手指和滑鼠沒有壓力，當作中等
  const prs=q=>q.pointerType==='pen'?Math.max(.05,Math.min(1,q.pressure||.5)):.5;
  const seg=(a,b)=>{const P=PENS[pen];g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineWidth=pw(P,[0,0,(a[2]+b[2])/2],fs0);g.stroke()};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();
    // 用 Apple Pencil 畫時，手掌碰到螢幕不算
    if(pts&&e.pointerType!=='pen')return;if(pts&&id0!==e.pointerId){pts=null;g.clearRect(0,0,innerWidth,innerHeight)}
    id0=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(pen<0){pts=[];eraseAt(e.clientX,e.clientY);return}
    pts=[[e.clientX,e.clientY,prs(e)]];
    const ln=nearLine(e.clientY),P=PENS[pen];fs0=ln?parseFloat(getComputedStyle(ln).fontSize):20;g.strokeStyle=P.c;g.globalAlpha=P.o;
    if(P.o<1){g.globalCompositeOperation='copy'}else g.globalCompositeOperation='source-over';
    g.beginPath();g.arc(e.clientX,e.clientY,pw(P,pts[0],fs0)/2,0,7);g.fillStyle=P.c;g.fill()});
  cv.addEventListener('pointermove',e=>{if(!pts||e.pointerId!==id0)return;const ev=e.getCoalescedEvents&&e.getCoalescedEvents().length?e.getCoalescedEvents():[e];
    if(pen<0){ev.forEach(q=>eraseAt(q.clientX,q.clientY));return}
    const P=PENS[pen];
    if(P.o<1){ev.forEach(q=>pts.push([q.clientX,q.clientY,.5]));g.clearRect(0,0,innerWidth,innerHeight);g.globalCompositeOperation='source-over';g.lineWidth=P.w*fs0;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();return}
    ev.forEach(q=>{const b=[q.clientX,q.clientY,prs(q)],a=pts[pts.length-1];if(Math.hypot(b[0]-a[0],b[1]-a[1])<.6)return;seg(a,b);pts.push(b)})});
  const end=e=>{if(!pts||(e&&e.pointerId!==id0))return;const P=pts;pts=null;g.clearRect(0,0,innerWidth,innerHeight);if(pen<0)return;if(P.length<2)P.push([P[0][0]+.5,P[0][1],P[0][2]]);addStroke(P)};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function nearLine(y){let best=null,bd=1e9;document.querySelectorAll('.sub p.cur .ln').forEach(el=>{const r=el.getBoundingClientRect(),d=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0;if(d<bd){bd=d;best=el}});return best}
function addStroke(P){
  const ys=P.map(q=>q[1]).sort((a,b)=>a-b),ln=nearLine(ys[ys.length>>1]);if(!ln)return;
  const r=ln.getBoundingClientRect(),fs=parseFloat(getComputedStyle(ln).fontSize)||20;
  const k=lineKey(+ln.dataset.l),a=allInk(),o=a[key]||(a[key]={});const hl=PENS[pen].o<1;(o[k]||(o[k]=[])).push({c:pen,p:P.map(q=>{const v=[+((q[0]-r.left)/fs).toFixed(3),+((q[1]-r.top)/fs).toFixed(3)];if(!hl)v.push(+q[2].toFixed(2));return v})});
  saveInk(a);inkHist.push({k});drawInk();
}
function undoInk(){const h=inkHist.pop();if(!h)return;const a=allInk(),o=a[key]||(a[key]={}),k=h.k;
  if(h.del){(o[k]||(o[k]=[])).splice(Math.min(h.i,o[k].length),0,h.del)}
  else if(o[k]&&o[k].length){o[k].pop();if(!o[k].length)delete o[k]}
  saveInk(a);drawInk()}
// 橡皮擦：筆尖碰到的那一整筆擦掉（跟 GoodNotes 的「擦整筆」一樣），可以用「上一筆」救回來
function eraseAt(x,y){
  const a=allInk(),o=a[key];if(!o)return;let hit=false;
  document.querySelectorAll('.sub p.cur .ln').forEach(el=>{
    const k=lineKey(+el.dataset.l),st=o[k];if(!st||!st.length)return;
    const r=el.getBoundingClientRect(),fs=parseFloat(getComputedStyle(el).fontSize)||20,px=(x-r.left)/fs,py=(y-r.top)/fs,R=.45;
    for(let i=st.length-1;i>=0;i--){const P=PENS[st[i].c]||PENS[0],rr=R+P.w/2,p=st[i].p;
      let on=false;for(let j=0;j<p.length&&!on;j++){const b=p[j],c=p[j+1]||b,dx=c[0]-b[0],dy=c[1]-b[1],L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((px-b[0])*dx+(py-b[1])*dy)/L)):0;on=Math.hypot(px-b[0]-t*dx,py-b[1]-t*dy)<rr}
      if(on){inkHist.push({k,del:st[i],i});st.splice(i,1);hit=true}}
    if(!st.length)delete o[k];
  });
  if(hit){saveInk(a);drawInk()}
}
function clearInk(){if(!confirm('把這一段畫的都清掉？'))return;const a=allInk(),o=a[key]||{};document.querySelectorAll('.sub p.cur .ln').forEach(el=>delete o[lineKey(+el.dataset.l)]);saveInk(a);inkHist=[];drawInk()}
function stopDraw(){['pad','pentools'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});document.body.classList.remove('drawing')}
render();
</script>
