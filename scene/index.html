<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歌曲情境圖</title>
<meta name="theme-color" content="#0d0b09">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=1">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：一首歌一張情境圖。上面是圖（點圖＝下一段），下面一排時間線，中間一句故事。永遠是暗色，像電影院。 */
:root{
  --bg:#0d0b09; --ink:#f3ece2; --muted:#a89d8f; --line:#2e2822; --glow:#f2c27b; --glow-soft:rgba(242,194,123,.18);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1180px;margin:0 auto;padding:10px 16px 24px}
header{display:flex;align-items:center;gap:12px;padding:4px 0 10px}
header a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 0;white-space:nowrap}
header h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.04em}
header .by{color:var(--muted);font-size:13px}
.stage{position:relative;width:min(100%,calc((100vh - 250px)*1024/572));margin:0 auto;aspect-ratio:1024/572;border-radius:14px;overflow:hidden;cursor:pointer;user-select:none;background:#000}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;pointer-events:none;transition:background .6s ease}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .5s ease}
.spot i{width:14px;height:14px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 6px var(--glow-soft),0 0 18px var(--glow)}
.spot b{font-family:var(--display);font-size:clamp(13px,1.8vw,18px);font-weight:700;color:#fff;text-shadow:0 1px 6px #000,0 0 2px #000;white-space:nowrap}
.spot.dim{opacity:.28}.spot.dim i{box-shadow:none}
.spot.on i{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(242,194,123,0),0 0 26px var(--glow)}}
.line{min-height:3.4em;margin:14px 2px 12px;font-family:var(--display);font-size:clamp(17px,2.4vw,22px);line-height:1.55;text-align:center}
.line small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.12em;margin-bottom:2px}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tl button{background:none;border:1px solid var(--line);border-radius:12px;color:var(--muted);padding:8px 2px 9px;font:inherit;cursor:pointer;display:grid;gap:2px;justify-items:center;min-width:0}
.tl button span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl button b{font-family:var(--display);font-size:clamp(15px,2.2vw,19px);color:var(--ink);font-weight:700;white-space:nowrap}
.tl button em{font-style:normal;font-size:12px}
.tl button.on{border-color:var(--glow);background:var(--glow-soft);color:var(--glow)}
.tl button.on b{color:var(--glow)}
.tl button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.hint{color:var(--muted);font-size:12.5px;text-align:center;margin-top:12px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:620px){.tl{grid-template-columns:repeat(3,minmax(0,1fr))}.stage{border-radius:10px}}
@media (prefers-reduced-motion:reduce){.spot.on i{animation:none}.shade,.spot{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// 每首歌一筆：圖、熱點位置（圖上的百分比）、時間線（段落、看哪個東西、身體做的那一個字、一句故事）
const SCENES={
  jiayi:{
    title:'甲乙丙丁',artist:'李佳薇',img:'jiayi.jpg',
    spots:{coat:{x:42,y:57,name:'外套'},photo:{x:31,y:29,name:'照片'},neck:{x:20,y:59,name:'項鍊'},door:{x:86,y:50,name:'門'}},
    steps:[
      {sec:'主歌',spot:'coat',word:'輕',line:'他的東西還在，房間太安靜。'},
      {sec:'導歌一',spot:'photo',word:'推',line:'一件一件看，一句比一句往上。'},
      {sec:'導歌二',spot:'neck',word:'收',line:'心還在他那裡。勇敢放出去，丟在原地收回來。'},
      {sec:'副歌',spot:'door',word:'打',line:'走到門口：怎麼兩清。每個「怎麼」都打出去。'},
      {sec:'第二輪',spot:'photo',word:'穩',line:'又被照片拉回來，這次站穩。'},
      {sec:'最後副歌',spot:'door',word:'全開',line:'唱到最滿。最後一句「同情」收輕。'}
    ]
  }
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let key='',cur=0;

function render(){
  key=(location.hash||'#jiayi').slice(1);
  const sc=SCENES[key];
  if(!sc){app.innerHTML=`<header><a href="../#songs">← 歌單</a></header><div class="empty">這首歌還沒有情境圖</div>`;return}
  document.title=sc.title+'・情境圖';
  const st=sc.steps[cur];
  const sp=sc.spots[st.spot];
  app.innerHTML=`<header><a href="../#songs">← 歌單</a><h1>${esc(sc.title)}</h1><span class="by">${esc(sc.artist)}</span></header>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="下一段">
    <img src="${esc(sc.img)}" alt="${esc(sc.title)}的情境圖">
    <div class="shade" style="background:radial-gradient(circle at ${sp.x}% ${sp.y}%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 12%,rgba(0,0,0,.55) 42%,rgba(0,0,0,.72) 100%)"></div>
    ${Object.entries(sc.spots).map(([k,s])=>`<div class="spot ${k===st.spot?'on':'dim'}" style="left:${s.x}%;top:${s.y}%"><i></i><b>${esc(s.name)}</b></div>`).join('')}
  </div>
  <div class="line" aria-live="polite"><small>${esc(st.sec)}・${esc(sp.name)} ${esc(st.word)}</small>${esc(st.line)}</div>
  <div class="tl">${sc.steps.map((s,i)=>`<button class="${i===cur?'on':''}" data-i="${i}" aria-pressed="${i===cur}"><span>${esc(s.sec)}</span><b>${esc(sc.spots[s.spot].name)}</b><em>${esc(s.word)}</em></button>`).join('')}</div>
  <div class="hint">點圖往下一段，或按下面任一段</div>`;
}
function go(i){const n=SCENES[key].steps.length;cur=(i+n)%n;render()}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-i]');if(b)return go(+b.dataset.i);
  if(e.target.closest('#stage'))go(cur+1);
});
addEventListener('keydown',e=>{
  if(!SCENES[key])return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){if(e.key!=='Enter'||document.activeElement.id==='stage'){e.preventDefault();go(cur+1)}}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1)}
});
addEventListener('hashchange',()=>{cur=0;render()});
render();
</script>
</body>
</html>
