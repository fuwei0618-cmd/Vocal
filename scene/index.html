<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歌曲情境圖</title>
<meta name="theme-color" content="#0d0b09">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=1">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：情境圖固定在上（寬螢幕在左），歌詞在下面（右邊）滑。滑到哪段，圖上那個東西亮。永遠暗色。 */
:root{
  --bg:#0d0b09; --ink:#f3ece2; --muted:#a89d8f; --line:#2e2822; --glow:#f2c27b; --glow-soft:rgba(242,194,123,.16);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 8px}
header{display:flex;align-items:baseline;gap:10px;padding:2px 0 6px}
header a{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
header h1{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:.04em}
header .by{color:var(--muted);font-size:12px}
.stage{position:relative;width:100%;aspect-ratio:1024/572;border-radius:10px;overflow:hidden;cursor:pointer;user-select:none;background:#000}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;pointer-events:none;transition:background .5s ease}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;transition:opacity .4s ease}
.spot i{width:11px;height:11px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 5px var(--glow-soft),0 0 14px var(--glow)}
.spot b{font-family:var(--display);font-size:clamp(12px,1.6vw,16px);font-weight:700;color:#fff;text-shadow:0 1px 6px #000,0 0 2px #000;white-space:nowrap}
.spot.dim{opacity:.25}.spot.dim i{box-shadow:none}
.spot.on i{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(242,194,123,0),0 0 22px var(--glow)}}
.tl{display:flex;gap:4px;margin-top:6px;overflow-x:auto;scrollbar-width:none}.tl::-webkit-scrollbar{display:none}
.tl button{flex:1 0 auto;background:none;border:1px solid var(--line);border-radius:99px;color:var(--muted);padding:4px 9px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tl button b{font-family:var(--display);color:var(--ink);font-weight:700;margin-left:3px}
.tl button.on{border-color:var(--glow);background:var(--glow-soft);color:var(--glow)}.tl button.on b{color:var(--glow)}
.lyr{padding:6px 0 40vh}
.blk{padding:10px 12px 12px;margin:0 -12px;border-radius:12px;cursor:pointer;transition:opacity .3s ease,background .3s ease;opacity:.4}
.blk.on{opacity:1;background:var(--glow-soft)}
.blk h3{margin:0 0 4px;font-size:12.5px;font-weight:500;color:var(--glow);letter-spacing:.06em}
.blk h3 b{font-family:var(--display);font-size:15px;margin:0 4px}
.blk h3 span{color:var(--muted);letter-spacing:0;margin-left:4px}
.blk p{margin:0;font-family:var(--display);font-size:18px;line-height:1.6}
.paste{display:grid;gap:8px;padding:10px 0 40px}
.paste p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.paste textarea{width:100%;min-height:42vh;background:#17130f;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.6 var(--body)}
.paste .row{display:flex;gap:8px;justify-content:flex-end}
.btn{background:var(--glow);color:#1a120a;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.edit{display:block;margin:18px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
button:focus-visible,.stage:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
/* 寬螢幕（iPad 橫放）：圖在左固定，歌詞在右 */
@media (min-width:900px){
  .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
  .top{top:0}
  .lyr{padding-top:44px}
}
@media (prefers-reduced-motion:reduce){.spot.on i{animation:none}.shade,.spot,.blk{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// 每首歌一筆：圖、熱點位置（圖上的百分比）、段落（看哪個東西、身體做的一個字、一句提示、這段有幾行歌詞）。
// 歌詞不放在程式裡（這個網站是公開的），第一次打開時貼上，只存在這台裝置。
const SCENES={
  jiayi:{
    title:'甲乙丙丁',artist:'李佳薇',img:'jiayi.jpg',
    spots:{coat:{x:42,y:57,name:'外套'},photo:{x:31,y:29,name:'照片'},neck:{x:20,y:59,name:'項鍊'},door:{x:86,y:50,name:'門'}},
    steps:[
      {sec:'主歌',spot:'coat',word:'輕',cue:'他的東西還在，房間太安靜',n:4},
      {sec:'導歌',spot:'photo',word:'推',cue:'一句比一句往上',n:3},
      {sec:'導歌',spot:'neck',word:'收',cue:'勇敢放，丟在原地收',n:4},
      {sec:'副歌',spot:'door',word:'打',cue:'每個「怎麼」都打出去',n:7},
      {sec:'第二輪',spot:'photo',word:'穩',cue:'又被拉回來，這次站穩',n:7},
      {sec:'副歌',spot:'door',word:'打',cue:'比第一次更確定',n:7},
      {sec:'最後副歌',spot:'door',word:'全開',cue:'最滿，最後「同情」收輕',n:7}
    ]
  }
};
const LKEY='scene-lyrics-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let key='',cur=0,editing=false;

function loadLyrics(){try{return (JSON.parse(localStorage.getItem(LKEY)||'{}')||{})[key]||''}catch(e){return ''}}
function saveLyrics(t){let all={};try{all=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){}all[key]=t;try{localStorage.setItem(LKEY,JSON.stringify(all))}catch(e){alert('這台裝置沒辦法存歌詞')}}
// 依每段行數切歌詞；多出來的行併到最後一段
function split(text,steps){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let i=0;
  return steps.map((s,k)=>{const take=k===steps.length-1?lines.length-i:s.n;const L=lines.slice(i,i+take);i+=take;return L});
}

function render(){
  key=(location.hash||'#jiayi').slice(1);
  const sc=SCENES[key];
  if(!sc){app.innerHTML=`<div class="top"><header><a href="../#songs">← 歌單</a></header></div><div class="empty">這首歌還沒有情境圖</div>`;return}
  document.title=sc.title+'・情境圖';
  const text=loadLyrics();
  const blocks=text?split(text,sc.steps):null;
  const top=`<div class="top"><header><a href="../#songs">← 歌單</a><h1>${esc(sc.title)}</h1><span class="by">${esc(sc.artist)}</span></header>
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="下一段"><img src="${esc(sc.img)}" alt="${esc(sc.title)}的情境圖"><div class="shade" id="shade"></div>
    ${Object.entries(sc.spots).map(([k,s])=>`<div class="spot" data-spot="${k}" style="left:${s.x}%;top:${s.y}%"><i></i><b>${esc(s.name)}</b></div>`).join('')}</div>
    <div class="tl">${sc.steps.map((s,i)=>`<button data-i="${i}">${esc(s.sec)}<b>${esc(sc.spots[s.spot].name)} ${esc(s.word)}</b></button>`).join('')}</div></div>`;
  let body;
  if(!blocks||editing){
    body=`<div class="paste"><p>把這首歌的歌詞整首貼進來，一行一句、照順序。<br>歌詞只存在這台裝置，不會放到網路上。</p>
      <textarea id="lyr-in" placeholder="還沒來得及習慣…">${esc(text)}</textarea>
      <div class="row">${text?'<button class="btn ghost" data-act="cancel">取消</button>':''}<button class="btn" data-act="save">存好</button></div></div>`;
  }else{
    body=`<div class="lyr">${sc.steps.map((s,i)=>`<section class="blk" data-b="${i}"><h3>${esc(s.sec)}<b>${esc(sc.spots[s.spot].name)} ${esc(s.word)}</b><span>${esc(s.cue)}</span></h3><p>${(blocks[i]||[]).map(esc).join('<br>')}</p></section>`).join('')}
      <button class="edit" data-act="edit">修改歌詞</button></div>`;
  }
  app.innerHTML=`<div class="grid">${top}${body}</div>`;
  mark(cur);
}

// 只換亮暗，不重畫，才不會打斷滑動
function mark(i){
  const sc=SCENES[key];cur=i;const st=sc.steps[i],sp=sc.spots[st.spot];
  const sh=document.getElementById('shade');
  if(sh)sh.style.background=`radial-gradient(circle at ${sp.x}% ${sp.y}%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 12%,rgba(0,0,0,.5) 40%,rgba(0,0,0,.7) 100%)`;
  document.querySelectorAll('.spot').forEach(el=>{const on=el.dataset.spot===st.spot;el.classList.toggle('on',on);el.classList.toggle('dim',!on)});
  document.querySelectorAll('.tl button').forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);if(on)b.scrollIntoView({block:'nearest',inline:'nearest'})});
  document.querySelectorAll('.blk').forEach(b=>b.classList.toggle('on',+b.dataset.b===i));
}
const wide=()=>matchMedia('(min-width:900px)').matches;
function lineY(){const t=document.querySelector('.top');return wide()?120:(t?t.getBoundingClientRect().bottom:0)+40}
function goTo(i){
  const n=SCENES[key].steps.length;i=(i+n)%n;mark(i);
  const b=document.querySelector(`.blk[data-b="${i}"]`);if(!b)return;
  lock=Date.now();
  const y=b.getBoundingClientRect().top+scrollY-(lineY()-24);
  scrollTo({top:Math.max(0,y),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
// 滑動時：碰到參考線的那一段就是現在這段
let lock=0,ticking=false;
addEventListener('scroll',()=>{if(ticking||Date.now()-lock<700)return;ticking=true;requestAnimationFrame(()=>{ticking=false;
  const bl=[...document.querySelectorAll('.blk')];if(!bl.length)return;const y=lineY();let pick=0;
  bl.forEach((b,i)=>{if(b.getBoundingClientRect().top<=y)pick=i});
  if(pick!==cur)mark(pick)})},{passive:true});

app.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='save'){const t=document.getElementById('lyr-in').value.trim();if(!t)return;saveLyrics(t);editing=false;cur=0;render();scrollTo(0,0)}
    else if(act==='edit'){editing=true;render()}
    else if(act==='cancel'){editing=false;render()}
    return}
  const b=e.target.closest('[data-i]');if(b)return goTo(+b.dataset.i);
  const blk=e.target.closest('[data-b]');if(blk)return goTo(+blk.dataset.b);
  if(e.target.closest('#stage'))goTo(cur+1);
});
addEventListener('keydown',e=>{
  if(!SCENES[key]||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();goTo(cur+1)}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();goTo(cur-1)}
});
addEventListener('hashchange',()=>{cur=0;editing=false;render()});
render();
</script>
</body>
</html>
