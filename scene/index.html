<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歌曲情境圖</title>
<meta name="theme-color" content="#0d0b09">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=1">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：情境圖固定不動、鋪滿畫面，歌詞像字幕疊在下半部滑，唱到哪就亮哪個物品。直的手機時圖放上面整張。永遠暗色。 */
:root{
  --bg:#0d0b09; --ink:#f6efe4; --muted:#bfb3a3; --line:rgba(255,255,255,.16); --glow:#f2c27b; --glow-soft:rgba(242,194,123,.16);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.bg{position:fixed;left:0;top:0;z-index:0}
.blur{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.15);display:none}
.bg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;transition:background .6s ease}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;transition:opacity .5s ease}
.spot i{width:12px;height:12px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 5px var(--glow-soft),0 0 16px var(--glow)}
.spot b{font-family:var(--display);font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 8px #000,0 0 2px #000;white-space:nowrap}
.spot.dim{opacity:0}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;opacity:.55;animation:tw 3s ease-in-out infinite}
.stars.on i{opacity:1;box-shadow:0 0 6px #fff,0 0 10px rgba(255,240,200,.8)}
@keyframes tw{50%{opacity:.15}}
.spot.on i{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(242,194,123,0),0 0 24px var(--glow)}}
/* 讓字看得清楚：下半部暗，物品都在上半部 */
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 54%,rgba(0,0,0,.72) 70%,rgba(0,0,0,.85) 100%)}
.bar{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:baseline;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.bar a{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.bar .by{color:var(--muted);font-size:12px}
.bar{flex-wrap:wrap}.bar .now{flex-basis:100%;order:9;font-size:12.5px;color:var(--glow);letter-spacing:.06em;text-shadow:0 1px 6px #000;min-height:1.4em}
.bar .now b{font-family:var(--display);font-size:15px;margin:0 4px}.bar .now span{color:var(--muted);letter-spacing:0;margin-left:2px}
.bar .edit{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0}
.lyr{position:relative;z-index:2;padding:70vh 20px 50vh;max-width:680px}
.blk{padding:8px 0 10px}
.blk h3{transition:opacity .35s ease;opacity:.35}.blk.on h3,.blk.past h3{opacity:0}
.ln{cursor:pointer;transition:opacity .35s ease,color .35s ease;opacity:.4}
.ln.on{opacity:1;color:#fff}.ln.past{opacity:0}
.blk h3{margin:0 0 2px;font-size:12px;font-weight:500;color:var(--glow);letter-spacing:.06em;text-shadow:0 1px 6px #000}
.blk h3 b{font-family:var(--display);font-size:14px;margin:0 4px}
.blk h3 span{color:var(--muted);letter-spacing:0;margin-left:2px}
.blk p{margin:0;font-family:var(--display);font-size:19px;line-height:1.6;text-shadow:0 1px 10px rgba(0,0,0,.9),0 0 2px #000}
.ln.on{text-shadow:0 0 14px rgba(242,194,123,.45),0 1px 10px rgba(0,0,0,.9)}
.paste{position:relative;z-index:2;display:grid;gap:8px;margin:0 auto;max-width:560px;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 40px}
.paste p{margin:0;color:var(--ink);font-size:14px;line-height:1.6;text-shadow:0 1px 6px #000}
.paste textarea{width:100%;min-height:50vh;background:rgba(15,12,9,.82);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.6 var(--body)}
.paste .row{display:flex;gap:8px;justify-content:flex-end}
.btn{background:var(--glow);color:#1a120a;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:rgba(0,0,0,.5);color:var(--muted);border:1px solid var(--line)}
.empty{position:relative;z-index:2;padding:40vh 0;text-align:center;color:var(--muted)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
/* 寬螢幕（iPad 橫放）：一樣歌詞在下面，像字幕，置中 */
@media (min-width:900px){.lyr{margin:0 auto}.blk p{font-size:19px;line-height:1.5}}
/* 直的手機：圖在上面一整張，歌詞從圖下面開始 */
@media (orientation:portrait){
  .blur{display:block}
  .bg{z-index:3}
  .bar{z-index:4;background:var(--bg)}
  .veil{background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) var(--img-bottom,40%),rgba(0,0,0,.35) calc(var(--img-bottom,40%) + 40px),rgba(0,0,0,.6) 100%)}
  .lyr{padding-top:calc(var(--img-bottom,40vh) + 24px)}
}
/* 物品在畫面下半部的歌（lay-top）：橫的螢幕歌詞放上半部，只顯示正在唱的那段，才不會蓋到物品 */
@media (orientation:landscape){
  body.lay-top .veil{background:linear-gradient(to bottom,rgba(0,0,0,.6) 0,rgba(0,0,0,.45) 45%,rgba(0,0,0,0) 62%)}
  body.lay-top .lyr{padding-top:14vh}
  body.lay-top .ln.far,body.lay-top .blk:not(.on) h3{opacity:0}
}
@media (prefers-reduced-motion:reduce){.stars i{animation:none}.spot.on i{animation:none}.shade,.spot,.blk{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 每首歌一筆：圖、圖的長寬比、熱點位置（圖上的百分比）、段落（看哪個東西、身體做的一個字、一句提示、這段有幾行歌詞）。
// spot 可以是陣列：一行歌詞對一個東西，陣列用完就停在最後一個。
// 歌詞不放在程式裡（這個網站是公開的），第一次打開時貼上，只存在這台裝置。
const SCENES={
  jiayi:{
    title:'甲乙丙丁',artist:'李佳薇',img:'jiayi.jpg?v=5',ratio:2752/1536,
    spots:{coat:{x:39.5,y:57,name:'外套'},photo:{x:30.5,y:28,name:'照片'},neck:{x:21,y:61,name:'項鍊'},dinner:{x:58,y:60,name:'晚餐'},laundry:{x:70,y:52,name:'衣服'},door:{x:86,y:40,name:'門'}},
    steps:[
      {sec:'主歌',spot:'coat',word:'輕',cue:'他的東西還在，房間太安靜',n:4},
      {sec:'導歌',spot:['photo','laundry','dinner'],word:'推',cue:'一句比一句往上',n:3},
      {sec:'導歌',spot:'neck',word:'收',cue:'勇敢放，丟在原地收',n:4},
      {sec:'副歌',spot:'door',word:'打',cue:'每個「怎麼」都打出去',n:7},
      {sec:'第二輪',spot:['photo','laundry','dinner','neck'],word:'穩',cue:'又被拉回來，這次站穩',n:7},
      {sec:'副歌',spot:'door',word:'打',cue:'比第一次更確定',n:7},
      {sec:'最後副歌',spot:'door',word:'全開',cue:'最滿，最後「同情」收輕',n:7}
    ]
  },
  houlai:{
    title:'後來',artist:'劉若英',img:'houlai.jpg?v=5',ratio:1024/572,layout:'top',
    // 星空是後製加的：在窗戶的天空範圍裡畫小星星（x0,y0,x1,y1，百分比）
    stars:[[1,2,34,30],[41,2,51,28]],
    spots:{city:{x:18,y:58,name:'人海'},flower:{x:31,y:76,name:'梔子花'},skirt:{x:49,y:70,name:'百褶裙'},stars:{x:16,y:13,name:'星光'},photo:{x:67,y:81,name:'舊照片'}},
    steps:[
      {sec:'開場',spot:'city',word:'輕',cue:'像自言自語',n:6},
      {sec:'主歌',spot:['flower','skirt','flower'],word:'甜',cue:'聞得到那個夏天',n:4},
      {sec:'主歌',spot:'stars',word:'暖',cue:'十七歲的星光',n:4},
      {sec:'主歌',spot:'photo',word:'問',cue:'輕輕問，不用答案',n:4},
      {sec:'主歌',spot:'city',word:'悔',cue:'同一個深夜，兩個地方',n:4},
      {sec:'導歌',spot:'photo',word:'柔',cue:'想像他怎麼想起你',n:2},
      {sec:'副歌',spot:'city',word:'放',cue:'消失在人海，放出去',n:6},
      {sec:'導歌',spot:'photo',word:'柔',cue:'比上一次更溫柔',n:2},
      {sec:'副歌',spot:'city',word:'放',cue:'更寬、更遠',n:6},
      {sec:'最後副歌',spot:['city','city','city','city','city','city','flower'],word:'收',cue:'最後兩句回到花，輕輕收',n:8}
    ]
  }
};
const LKEY='scene-lyrics-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let key='',cur=0,curL=0,editing=false;
const spotOf=(st,l)=>Array.isArray(st.spot)?st.spot[Math.min(l,st.spot.length-1)]:st.spot;
const namesOf=(sc,st)=>[...new Set([].concat(st.spot))].map(k=>sc.spots[k].name).join('・');

function loadLyrics(){try{return (JSON.parse(localStorage.getItem(LKEY)||'{}')||{})[key]||''}catch(e){return ''}}
function saveLyrics(t){let all={};try{all=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){}all[key]=t;try{localStorage.setItem(LKEY,JSON.stringify(all))}catch(e){alert('這台裝置沒辦法存歌詞')}}
// 依每段行數切歌詞；多出來的行併到最後一段
function split(text,steps){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^[-—=_~*·.]+$/.test(s));let i=0;
  return steps.map((s,k)=>{const take=k===steps.length-1?lines.length-i:s.n;const L=lines.slice(i,i+take);i+=take;return L});
}
// 固定的假亂數，星星每次位置都一樣
function starsHtml(sc){
  if(!sc.stars)return '';let seed=7,h='';const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  sc.stars.forEach(([x0,y0,x1,y1])=>{const n=Math.round((x1-x0)*(y1-y0)/9);for(let k=0;k<n;k++){const sz=r()<.15?3:2;
    h+=`<i style="left:${(x0+r()*(x1-x0)).toFixed(2)}%;top:${(y0+r()*(y1-y0)).toFixed(2)}%;width:${sz}px;height:${sz}px;animation-delay:${(r()*3).toFixed(2)}s"></i>`}});
  return `<div class="stars" id="stars">${h}</div>`;
}

function render(){
  key=(location.hash||'#jiayi').slice(1);
  const sc=SCENES[key];
  if(!sc){app.innerHTML=`<div class="bar"><a href="../#songs">← 歌單</a></div><div class="empty">這首歌還沒有情境圖</div>`;return}
  document.title=sc.title+'・情境圖';
  document.body.classList.toggle('lay-top',sc.layout==='top');
  const text=loadLyrics(),blocks=text?split(text,sc.steps):null,paste=!blocks||editing;
  const bg=`<div class="blur" style="background-image:url('${esc(sc.img)}')"></div><div class="bg" id="bg"><img src="${esc(sc.img)}" alt="${esc(sc.title)}的情境圖"><div class="shade" id="shade"></div>${starsHtml(sc)}
    ${Object.entries(sc.spots).map(([k,s])=>`<div class="spot" data-spot="${k}" style="left:${s.x}%;top:${s.y}%"><i></i><b>${esc(s.name)}</b></div>`).join('')}</div><div class="veil"></div>`;
  const bar=`<div class="bar"><a href="../#songs">← 歌單</a><h1>${esc(sc.title)}</h1><span class="by">${esc(sc.artist)}・v5</span>${paste?'':'<button class="edit" data-act="edit">改歌詞</button><div class="now" id="now"></div>'}</div>`;
  const body=paste
    ?`<div class="paste"><p>把這首歌的歌詞整首貼進來，一行一句、照順序。<br>歌詞只存在這台裝置，不會放到網路上。</p>
      <textarea id="lyr-in" placeholder="第一句歌詞…">${esc(text)}</textarea>
      <div class="row">${text?'<button class="btn ghost" data-act="cancel">取消</button>':''}<button class="btn" data-act="save">存好</button></div></div>`
    :`<div class="lyr">${sc.steps.map((s,i)=>`<section class="blk" data-b="${i}"><h3>${esc(s.sec)}<b>${esc(namesOf(sc,s))} ${esc(s.word)}</b><span>${esc(s.cue)}</span></h3><p>${(blocks[i]||[]).map((t,k)=>`<span class="ln" data-b="${i}" data-l="${k}" style="display:block">${esc(t)}</span>`).join('')}</p></section>`).join('')}</div>`;
  app.innerHTML=bg+bar+body;
  mark(cur,true,curL);
}

// 圖鋪滿螢幕（像 object-fit:cover），再左右平移，讓現在那段的物品落在看得到的位置
// 圖固定不動。橫的螢幕：鋪滿（像 object-fit:cover）置中；直的手機：整張寬度放在上面，背後用同一張圖模糊鋪滿，才看得到全部物品
const portrait=()=>innerWidth<innerHeight;
function place(){
  const sc=SCENES[key],bg=document.getElementById('bg');if(!bg)return;
  const vw=innerWidth,vh=innerHeight;let W,H,tx,ty;
  if(portrait()){W=vw;H=W/sc.ratio;tx=0;ty=document.querySelector('.bar').offsetHeight}
  else{W=Math.max(vw,vh*sc.ratio);H=W/sc.ratio;tx=(vw-W)/2;ty=(vh-H)/2}
  bg.style.width=W+'px';bg.style.height=H+'px';bg.style.transform=`translate(${tx}px,${ty}px)`;
  document.documentElement.style.setProperty('--img-bottom',(ty+H)+'px');
}
// 只換亮暗和位置，不重畫，才不會打斷滑動
function mark(i,instant,l=0){
  const sc=SCENES[key];cur=i;curL=l;const st=sc.steps[i],k=spotOf(st,l),sp=sc.spots[k];
  const sh=document.getElementById('shade');
  if(sh)sh.style.background=`radial-gradient(circle at ${sp.x}% ${sp.y}%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 9%,rgba(0,0,0,.45) 30%,rgba(0,0,0,.6) 100%)`;
  const now=document.getElementById('now');if(now)now.innerHTML=`${esc(st.sec)}<b>${esc(sp.name)} ${esc(st.word)}</b><span>${esc(st.cue)}</span>`;
  const stz=document.getElementById('stars');if(stz)stz.classList.toggle('on',k==='stars');
  document.querySelectorAll('.spot').forEach(el=>{const on=el.dataset.spot===k;el.classList.toggle('on',on);el.classList.toggle('dim',!on)});
  document.querySelectorAll('.blk').forEach(b=>{b.classList.toggle('on',+b.dataset.b===i);b.classList.toggle('past',+b.dataset.b<i)});
  // 一句一句：唱過的消失、這句最亮、還沒唱的排在下面（物品在下半部的歌只露出下兩句）
  const all=[...document.querySelectorAll('.ln')],g=all.findIndex(e=>+e.dataset.b===i&&+e.dataset.l===l);
  all.forEach((e,j)=>{e.classList.toggle('past',j<g);e.classList.toggle('on',j===g);e.classList.toggle('far',j>g+2)});
  place();
}
const lineY=()=>portrait()?(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--img-bottom'))||innerHeight*.4)+48:innerHeight*(document.body.classList.contains('lay-top')?.2:.74);
function goLine(d){
  const all=[...document.querySelectorAll('.ln')];if(!all.length)return;
  let g=all.findIndex(e=>+e.dataset.b===cur&&+e.dataset.l===curL)+d;g=Math.max(0,Math.min(all.length-1,g));
  goTo(+all[g].dataset.b,+all[g].dataset.l);
}
function goTo(i,l=0){
  const n=SCENES[key].steps.length;i=Math.max(0,Math.min(n-1,i));mark(i,false,l);
  const b=document.querySelector(`.ln[data-b="${i}"][data-l="${l}"]`);if(!b)return;
  lock=Date.now();
  const y=b.getBoundingClientRect().top+scrollY-(lineY()-6);
  scrollTo({top:Math.max(0,y),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
// 滑動時：碰到參考線的那一段就是現在這段
let lock=0,ticking=false;
addEventListener('scroll',()=>{if(ticking||Date.now()-lock<700)return;ticking=true;requestAnimationFrame(()=>{ticking=false;
  const all=[...document.querySelectorAll('.ln')];if(!all.length)return;const y=lineY();let e=all[0];
  all.forEach(x=>{if(x.getBoundingClientRect().top<=y)e=x});
  const pick=+e.dataset.b,ln=+e.dataset.l;
  if(pick!==cur||ln!==curL)mark(pick,false,ln)})},{passive:true});
addEventListener('resize',()=>place());

app.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='save'){const t=document.getElementById('lyr-in').value.trim();if(!t)return;saveLyrics(t);editing=false;cur=0;render();scrollTo(0,0)}
    else if(act==='edit'){editing=true;render();scrollTo(0,0)}
    else if(act==='cancel'){editing=false;render()}
    return}
  const ln=e.target.closest('.ln');if(ln)return goTo(+ln.dataset.b,+ln.dataset.l);
});
addEventListener('keydown',e=>{
  if(!SCENES[key]||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();goLine(1)}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();goLine(-1)}
});
addEventListener('hashchange',()=>{cur=0;editing=false;render()});
render();
</script>
</body>
</html>
