<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>歌曲情境圖</title>
<meta name="theme-color" content="#0d0b09">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=1">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：情境圖固定鋪滿畫面，一次只顯示一段歌詞（像字幕），點一下螢幕換下一段，不用滑。直的手機時圖放上面整張。永遠暗色。 */
:root{
  --bg:#0d0b09; --ink:#f6efe4; --muted:#bfb3a3; --line:rgba(255,255,255,.16); --glow:#f2c27b; --glow-soft:rgba(242,194,123,.16);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body.play{overflow:hidden;height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bg{position:fixed;left:0;top:0;z-index:0}
.blur{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.15);display:none}
.bg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;transition:background .6s ease}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;transition:opacity .5s ease}
.spot i{width:12px;height:12px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 5px var(--glow-soft),0 0 16px var(--glow)}
.spot b{font-family:var(--display);font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 8px #000,0 0 2px #000;white-space:nowrap}
.spot.dim{opacity:0}
.spot.on i{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(242,194,123,0),0 0 24px var(--glow)}}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;opacity:.55;animation:tw 3s ease-in-out infinite}
.stars.on i{opacity:1;box-shadow:0 0 6px #fff,0 0 10px rgba(255,240,200,.8)}
@keyframes tw{50%{opacity:.15}}
/* 讓字看得清楚：歌詞那一帶暗下來 */
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 46%,rgba(0,0,0,.7) 66%,rgba(0,0,0,.85) 100%)}
.bar{position:fixed;left:0;right:0;top:0;z-index:4;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.bar a{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.bar .by{color:var(--muted);font-size:12px}
.bar .edit{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0}
.bar .now{flex-basis:100%;order:9;font-size:12.5px;color:var(--glow);letter-spacing:.06em;text-shadow:0 1px 6px #000;min-height:1.4em}
.bar .now b{font-family:var(--display);font-size:15px;margin:0 4px}.bar .now span{color:var(--muted);letter-spacing:0;margin-left:2px}
/* 點螢幕換段：整個畫面都是按鈕，左邊三分之一往回 */
.tap{position:fixed;inset:0;z-index:2;cursor:pointer}
.sub{position:fixed;z-index:3;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 40px));bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);pointer-events:none}
.sub p{margin:0;font-family:var(--display);font-size:20px;line-height:1.6;color:#fff;text-shadow:0 0 14px rgba(242,194,123,.35),0 1px 10px rgba(0,0,0,.95),0 0 2px #000}
.sub .cue{font-size:12.5px;color:var(--glow);letter-spacing:.06em;text-shadow:0 1px 6px #000;margin-bottom:4px}
.sub .cue b{font-family:var(--display);font-size:15px;margin:0 4px}.sub .cue span{color:var(--muted);letter-spacing:0;margin-left:2px}
.sub .next{margin-top:12px;opacity:.38}
.sub .ln{transition:opacity .3s,color .3s}
.sub.lines .ln{opacity:.55}.sub.lines .ln.past{opacity:.3}.sub.lines .ln.on{opacity:1;color:#fff3dc;text-shadow:0 0 16px rgba(242,194,123,.75),0 1px 10px rgba(0,0,0,.95)}
.sub .next small{display:block;font-size:11.5px;color:var(--glow);letter-spacing:.08em;margin-bottom:1px;text-shadow:0 1px 6px #000}
.sub .next p{font-size:17px;text-shadow:0 1px 8px #000}
.sub.swap{animation:swap .45s ease}
@keyframes swap{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.foot{position:fixed;z-index:3;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;pointer-events:none}
.foot button{pointer-events:auto;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.player{position:fixed;z-index:3;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.player button{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.player button.rec{border-color:#e46b6b;color:#ffb4b4}
.player .t{font-variant-numeric:tabular-nums;min-width:5.5em}
@media (max-width:640px){.player .t{display:none}.player button,.foot button{padding:6px 10px}.player{right:16px;flex-wrap:wrap;bottom:calc(env(safe-area-inset-bottom,0px) + 54px)}}
.hint{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);background:rgba(0,0,0,.65);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink);pointer-events:none;white-space:nowrap}
@media (max-width:640px){.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}}
.bar .edit+.edit{margin-left:0}
.paste{position:relative;z-index:5;display:grid;gap:8px;margin:0 auto;max-width:560px;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 40px}
.paste p{margin:0;color:var(--ink);font-size:14px;line-height:1.6;text-shadow:0 1px 6px #000}
.paste textarea{width:100%;min-height:50vh;background:rgba(15,12,9,.82);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.6 var(--body)}
.paste .row{display:flex;gap:8px;justify-content:flex-end}
.btn{background:var(--glow);color:#1a120a;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:rgba(0,0,0,.5);color:var(--muted);border:1px solid var(--line)}
.empty{position:relative;z-index:5;padding:40vh 0;text-align:center;color:var(--muted)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
/* 直的手機：圖在上面一整張，歌詞在圖下面 */
@media (orientation:portrait){
  .blur{display:block}
  .bar{background:var(--bg)}
  .veil{background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) var(--img-bottom,40%),rgba(0,0,0,.35) calc(var(--img-bottom,40%) + 40px),rgba(0,0,0,.6) 100%)}
  .sub{bottom:auto;top:calc(var(--img-bottom,40vh) + 22px)}
  .sub p{font-size:19px}
}
/* 物品在畫面下半部的歌（lay-top）：橫的螢幕歌詞放上面 */
@media (orientation:landscape){
  body.lay-top .veil{background:linear-gradient(to bottom,rgba(0,0,0,.6) 0,rgba(0,0,0,.45) 45%,rgba(0,0,0,0) 62%)}
  body.lay-top .sub{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 96px)}
}
@media (prefers-reduced-motion:reduce){.stars i,.spot.on i,.sub.swap{animation:none}.shade,.spot{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 每首歌一筆：圖、圖的長寬比、熱點位置（圖上的百分比）、段落（看哪個東西、身體做的一個字、一句提示、這段有幾行歌詞）。
// spot 可以是陣列：這段提到好幾樣東西，就一起亮。
// 歌詞不放在程式裡（這個網站是公開的），第一次打開時貼上，只存在這台裝置。
const SCENES={
  jiayi:{
    title:'甲乙丙丁',artist:'李佳薇',img:'jiayi.jpg?v=6',ratio:2752/1536,
    spots:{coat:{x:39.5,y:57,name:'外套'},photo:{x:30.5,y:28,name:'照片'},neck:{x:21,y:61,name:'項鍊'},dinner:{x:58,y:60,name:'晚餐'},laundry:{x:70,y:52,name:'衣服'},door:{x:86,y:40,name:'門'}},
    steps:[
      {sec:'主歌',spot:'coat',word:'輕',cue:'他的東西還在，房間太安靜',n:4},
      {sec:'導歌',spot:['photo','laundry','dinner'],word:'推',cue:'一句比一句往上',n:3},
      {sec:'導歌',spot:'neck',word:'收',cue:'勇敢放，丟在原地收',n:4},
      {sec:'副歌',spot:'door',word:'打',cue:'每個「怎麼」都打出去',n:7},
      {sec:'第二輪',spot:['photo','laundry','dinner','neck'],word:'穩',cue:'又被拉回來，這次站穩',n:7},
      {sec:'副歌',spot:'door',word:'打',cue:'比第一次更確定',n:7},
      {sec:'最後副歌',spot:'door',word:'全開',cue:'最滿，最後「同情」收輕',n:7}
    ]
  },
  houlai:{
    title:'後來',artist:'劉若英',img:'houlai.jpg?v=6',ratio:1024/572,layout:'top',
    // 星空是後製加的：在窗戶的天空範圍裡畫小星星（x0,y0,x1,y1，百分比）
    stars:[[1,2,34,30],[41,2,51,28]],
    spots:{city:{x:18,y:58,name:'人海'},flower:{x:31,y:76,name:'梔子花'},skirt:{x:49,y:70,name:'百褶裙'},stars:{x:16,y:13,name:'星光'},photo:{x:67,y:81,name:'舊照片'}},
    steps:[
      {sec:'開場',spot:'city',word:'輕',cue:'像自言自語',n:6},
      {sec:'主歌',spot:['flower','skirt'],word:'甜',cue:'聞得到那個夏天',n:4},
      {sec:'主歌',spot:'stars',word:'暖',cue:'十七歲的星光',n:4},
      {sec:'主歌',spot:'photo',word:'問',cue:'輕輕問，不用答案',n:4},
      {sec:'主歌',spot:'city',word:'悔',cue:'同一個深夜，兩個地方',n:4},
      {sec:'導歌',spot:'photo',word:'柔',cue:'想像他怎麼想起你',n:2},
      {sec:'副歌',spot:'city',word:'放',cue:'消失在人海，放出去',n:6},
      {sec:'導歌',spot:'photo',word:'柔',cue:'比上一次更溫柔',n:2},
      {sec:'副歌',spot:'city',word:'放',cue:'更寬、更遠',n:6},
      {sec:'最後副歌',spot:['city','flower'],word:'收',cue:'最後兩句回到花，輕輕收',n:8}
    ]
  }
};
// 版本號：每次改這頁就加 1。打開時會偷偷抓最新版比對，比較新就自動重新載入，避免 iPad 一直顯示舊的
const VER=15;
fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const VER=(\d+);/);if(m&&+m[1]>VER)location.replace(location.pathname+'?v='+m[1]+location.hash)}).catch(()=>{});
const LKEY='scene-lyrics-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let key='',cur=0,editing=false,blocks=null;
const spotsOf=st=>[...new Set([].concat(st.spot))];
const namesOf=(sc,st)=>spotsOf(st).map(k=>sc.spots[k].name).join('・');

function loadLyrics(){try{return (JSON.parse(localStorage.getItem(LKEY)||'{}')||{})[key]||''}catch(e){return ''}}
function saveLyrics(t){let all={};try{all=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){}all[key]=t;try{localStorage.setItem(LKEY,JSON.stringify(all))}catch(e){alert('這台裝置沒辦法存歌詞')}}
// 依每段行數切歌詞（略過空行和分隔線）；多出來的行併到最後一段
function split(text,steps){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^[-—=_~*·.]+$/.test(s));let i=0;
  return steps.map((s,k)=>{const take=k===steps.length-1?lines.length-i:s.n;const L=lines.slice(i,i+take);i+=take;return L});
}
// 星空後製：固定的假亂數，星星每次位置都一樣
function starsHtml(sc){
  if(!sc.stars)return '';let seed=7,h='';const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  sc.stars.forEach(([x0,y0,x1,y1])=>{const n=Math.round((x1-x0)*(y1-y0)/9);for(let k=0;k<n;k++){const sz=r()<.15?3:2;
    h+=`<i style="left:${(x0+r()*(x1-x0)).toFixed(2)}%;top:${(y0+r()*(y1-y0)).toFixed(2)}%;width:${sz}px;height:${sz}px;animation-delay:${(r()*3).toFixed(2)}s"></i>`}});
  return `<div class="stars" id="stars">${h}</div>`;
}

function render(){
  key=(location.hash||'#jiayi').slice(1);
  const sc=SCENES[key];
  if(!sc){app.innerHTML=`<div class="bar"><a href="../#songs">← 歌單</a></div><div class="empty">這首歌還沒有情境圖</div>`;return}
  document.title=sc.title+'・情境圖';
  document.body.classList.toggle('lay-top',sc.layout==='top');
  const text=loadLyrics();blocks=text?split(text,sc.steps):null;const paste=!blocks||editing;
  document.body.classList.toggle('play',!paste);
  const bg=`<div class="blur" style="background-image:url('${esc(sc.img)}')"></div><div class="bg" id="bg"><img src="${esc(sc.img)}" alt="${esc(sc.title)}的情境圖"><div class="shade" id="shade"></div>${starsHtml(sc)}
    ${Object.entries(sc.spots).map(([k,s])=>`<div class="spot" data-spot="${k}" style="left:${s.x}%;top:${s.y}%"><i></i><b>${esc(s.name)}</b></div>`).join('')}</div><div class="veil"></div>`;
  const bar=`<div class="bar"><a href="../#songs">← 歌單</a><h1>${esc(sc.title)}</h1><span class="by">${esc(sc.artist)}・v${VER}</span>${paste?'':'<button class="edit" data-act="audio" data-for="inst">＋伴奏</button><button class="edit" data-act="audio" data-for="orig">＋原唱</button><button class="edit" data-act="audio" data-for="vocal">＋人聲</button><button class="edit" data-act="edit">改歌詞</button>'}</div>`;
  const body=paste
    ?`<div class="paste"><p>把這首歌的歌詞整首貼進來，一行一句、照順序。<br>歌詞只存在這台裝置，不會放到網路上。</p>
      <textarea id="lyr-in" placeholder="第一句歌詞…">${esc(text)}</textarea>
      <div class="row">${text?'<button class="btn ghost" data-act="cancel">取消</button>':''}<button class="btn" data-act="save">存好</button></div></div>`
    :`<div class="tap" id="tap" aria-label="點一下換下一段"></div><div class="sub" id="sub" aria-live="polite"></div>
      <div class="foot"><button data-act="prev" aria-label="上一段">‹ 上一段</button><span id="count"></span></div>
      <div class="player" id="player" hidden></div><div class="hint" id="hint" hidden></div><input type="file" id="afile" hidden>`;
  app.innerHTML=bg+bar+body;
  show(cur,false);
  if(!paste)loadAudio();
}

// 圖固定不動。橫的螢幕：鋪滿（像 object-fit:cover）置中；直的手機：整張寬度放在上面，背後用同一張圖模糊鋪滿
const portrait=()=>innerWidth<innerHeight;
function place(){
  const sc=SCENES[key],bg=document.getElementById('bg');if(!bg)return;
  const vw=innerWidth,vh=innerHeight;let W,H,tx,ty;
  if(portrait()){W=vw;H=W/sc.ratio;tx=0;ty=document.querySelector('.bar').offsetHeight}
  else{W=Math.max(vw,vh*sc.ratio);H=W/sc.ratio;tx=(vw-W)/2;ty=(vh-H)/2}
  bg.style.width=W+'px';bg.style.height=H+'px';bg.style.transform=`translate(${tx}px,${ty}px)`;
  document.documentElement.style.setProperty('--img-bottom',(ty+H)+'px');
}
// 換到第 i 段：亮這段提到的東西，顯示這段歌詞和下一段的開頭
function show(i,anim=true){
  const sc=SCENES[key];const n=sc.steps.length;cur=Math.max(0,Math.min(n-1,i));
  const st=sc.steps[cur],ks=spotsOf(st),sp=sc.spots[ks[0]];
  const sh=document.getElementById('shade');
  if(sh)sh.style.background=ks.length>1?'rgba(0,0,0,.28)':`radial-gradient(circle at ${sp.x}% ${sp.y}%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 9%,rgba(0,0,0,.45) 30%,rgba(0,0,0,.6) 100%)`;
  const stz=document.getElementById('stars');if(stz)stz.classList.toggle('on',ks.includes('stars'));
  document.querySelectorAll('.spot').forEach(el=>{const on=ks.includes(el.dataset.spot);el.classList.toggle('on',on);el.classList.toggle('dim',!on)});
  const sub=document.getElementById('sub');
  if(sub&&blocks){
    const nx=sc.steps[cur+1];
    const off=blocks.slice(0,cur).reduce((a,b)=>a+b.length,0);
    sub.innerHTML=`<div class="cue">${esc(st.sec)}<b>${esc(namesOf(sc,st))} ${esc(st.word)}</b><span>${esc(st.cue)}</span></div><p class="cur">${(blocks[cur]||[]).map((l,k)=>`<span class="ln" data-l="${off+k}">${esc(l)}</span>`).join('<br>')}</p>`+(nx?`<div class="next"><small>下一段・${esc(namesOf(sc,nx))} ${esc(nx.word)}</small><p>${(blocks[cur+1]||[]).slice(0,2).map(esc).join('<br>')}</p></div>`:'<div class="next"><small>最後一段</small></div>');
    if(anim){sub.classList.remove('swap');sub.offsetWidth;sub.classList.add('swap')}
  }
  const c=document.getElementById('count');if(c)c.textContent=`${cur+1} / ${n}`;
  if(typeof au!=='undefined'&&au)drawPlayer();
  place();
}

app.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='save'){const t=document.getElementById('lyr-in').value.trim();if(!t)return;saveLyrics(t);editing=false;cur=0;render();scrollTo(0,0)}
    else if(act==='edit'){editing=true;render();scrollTo(0,0)}
    else if(act==='cancel'){editing=false;render()}
    else if(act==='prev')step(cur-1);
    else if(act==='audio'){const f=document.getElementById('afile');f.dataset.for=a.dataset.for;f.value='';f.click()}
    else if(act==='track')switchTrack();
    else if(act==='play'){if(!au)return;au.paused?au.play():au.pause()}
    else if(act==='rec')toggleRec();
    else if(act==='part')startPart();
    else if(act==='auto'){if(getTimes().length>1&&!confirm('用人聲重新算每段時間？你原本點的段會被換掉'))return;autoAlign(null,true)}
    return}
  if(e.target.id==='tap')step(e.clientX<innerWidth*.3?cur-1:cur+1);
});
// 鍵盤、藍牙翻頁踏板（多半送方向鍵、PageDown 或空白鍵）
addEventListener('keydown',e=>{
  if(!SCENES[key]||!document.body.classList.contains('play')||e.target.tagName==='TEXTAREA')return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();step(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(cur-1)}
});
addEventListener('resize',()=>place());
addEventListener('hashchange',()=>{cur=0;editing=false;if(au){au.pause();au=null}render()});

/* ---------- 伴奏：檔案存在這台裝置（IndexedDB），不會上傳 ---------- */
// 對拍：播放時每到下一段點一下，記下每段開始的秒數；之後播放就自動換段
const TKEY='scene-times-v1';
let au=null,auUrl='',rec=false,track='inst',have={inst:false,orig:false};
const TRACK={inst:'伴奏',orig:'原唱',vocal:'人聲'};let hasVocal=false;
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('scene-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function getFile(k){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('files').objectStore('files').get(k);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function putFile(k,f){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(f,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function getTimes(){try{return (JSON.parse(localStorage.getItem(TKEY)||'{}')||{})[key]||[]}catch(e){return []}}
function setTimes(a){let all={};try{all=JSON.parse(localStorage.getItem(TKEY)||'{}')||{}}catch(e){}all[key]=a;try{localStorage.setItem(TKEY,JSON.stringify(all))}catch(e){}}
const LNKEY='scene-lines-v1';
function getLines(){try{return (JSON.parse(localStorage.getItem(LNKEY)||'{}')||{})[key]||[]}catch(e){return []}}
function setLines(a){let all={};try{all=JSON.parse(localStorage.getItem(LNKEY)||'{}')||{}}catch(e){}all[key]=a;try{localStorage.setItem(LNKEY,JSON.stringify(all))}catch(e){}}
const mmss=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
let hintT=0;
function hint(t){clearTimeout(hintT);const h=document.getElementById('hint');if(!h)return;h.hidden=!t;h.textContent=t||''}
// 伴奏和原唱各存一份；對拍秒數兩個共用（同一個錄音分出來的，時間一樣）
async function loadAudio(want,at,play){
  const fi=await getFile(key+'|inst')||await getFile(key),fo=await getFile(key+'|orig');
  have={inst:!!fi,orig:!!fo};hasVocal=!!await getFile(key+'|vocal');
  if(hasVocal&&!getLines().length&&!loadAudio.did){loadAudio.did=1;autoAlign()}  // 之前放過人聲：補算逐句一次
  try{track=want||localStorage.getItem('scene-track')||'inst'}catch(e){track=want||'inst'}
  if(!have[track])track=have.inst?'inst':'orig';
  const f=track==='inst'?fi:fo;if(!f){drawPlayer();return}
  if(au)au.pause();
  if(auUrl)URL.revokeObjectURL(auUrl);auUrl=URL.createObjectURL(f);
  au=new Audio(auUrl);au.preload='auto';
  au.addEventListener('timeupdate',sync);au.addEventListener('play',drawPlayer);au.addEventListener('pause',()=>{drawPlayer();lightLine()});
  au.addEventListener('ended',()=>{if(rec)toggleRec();drawPlayer()});au.addEventListener('loadedmetadata',()=>{if(at)au.currentTime=at;if(play)au.play();drawPlayer()});
  drawPlayer();
}
function drawPlayer(){
  const p=document.getElementById('player');if(!p)return;
  if(!au){p.hidden=!hasVocal;p.innerHTML=hasVocal?'<span>只有人聲，再放伴奏或原唱就能播</span><button data-act="auto">自動對</button>':'';return}
  p.hidden=false;
  const has=getTimes().length>1;
  const sw=have.inst&&have.orig?`<button data-act="track" aria-label="切換伴奏或原唱">${TRACK[track]} ⇄</button>`:`<span>${TRACK[track]}</span>`;
  p.innerHTML=sw+`<button data-act="play">${au.paused?'▶ 播放':'❚❚ 暫停'}</button><span class="t">${mmss(au.currentTime)} / ${mmss(au.duration)}</span><button data-act="rec" class="${rec?'rec':''}">${rec?'● 對拍中・按這完成':has?'整首重對':'對拍'}</button>`+(has&&!rec?'<button data-act="part">從這段改</button>':'')+(hasVocal&&!rec?'<button data-act="auto">自動對</button>':'');
}
function switchTrack(){
  if(!au)return;const at=au.currentTime,play=!au.paused,to=track==='inst'?'orig':'inst';
  try{localStorage.setItem('scene-track',to)}catch(e){}
  loadAudio(to,at,play);
}
function toggleRec(){
  if(!au)return;
  if(rec){rec=false;hint('');if(recPart)finishPart();drawPlayer();return}
  rec=true;recPart=false;setTimes([0]);au.currentTime=0;show(0);au.play();
  hint('跟著音樂，每到下一段就點一下螢幕');drawPlayer();
}
// 只改一部分：從這段前 5 秒開始放，這段真正開始時點一下；後面也要改就繼續點，按「完成」結束，沒點到的段照舊
let recPart=false;
function startPart(){
  if(!au)return;const t=getTimes();rec=true;recPart=true;
  // 第一段一定從頭開始，所以改第一段＝從頭播、第二段開始時點
  if(cur===0){show(0);au.currentTime=0;au.play();hint('從頭播，唱到第二段開始時點一下螢幕。後面也要改就繼續點，改完按「完成」');drawPlayer();return}
  const at=Math.max(0,(t[cur]!=null?t[cur]:t[cur-1]||0)-5);show(cur-1);au.currentTime=at;au.play();
  hint('等這段開始的時候點一下螢幕。後面也要改就繼續點，改完按「完成」');drawPlayer();
}
function finishPart(){
  recPart=false;const t=getTimes();
  for(let j=1;j<t.length;j++)if(t[j]==null||t[j]<=t[j-1])t[j]=Math.round((t[j-1]+.5)*100)/100;
  setTimes(t);if(hasVocal)autoAlign(null,false,true);
  hint('改好了');hintT=setTimeout(()=>hint(''),2000);
}
// 換段：對拍中就記秒數；有對過拍、正在播，就把音樂跳到那段
function step(i){
  const n=SCENES[key].steps.length;i=Math.max(0,Math.min(n-1,i));
  if(au&&rec&&i===cur+1){const t=getTimes();t[i]=Math.round(au.currentTime*100)/100;setTimes(recPart?t:t.slice(0,i+1));show(i);if(i===n-1){rec=false;if(recPart){finishPart();drawPlayer();return}hint('對好了！之後播放會自動換段');hintT=setTimeout(()=>hint(''),2500);drawPlayer()}return}
  const t=getTimes();
  if(au&&!rec&&!au.paused&&t[i]!=null)au.currentTime=t[i];
  show(i);
}
let lastDraw=0;
function sync(){
  if(Date.now()-lastDraw>500){lastDraw=Date.now();const s=document.querySelector('#player .t');if(s)s.textContent=`${mmss(au.currentTime)} / ${mmss(au.duration)}`}
  if(rec)return;const t=getTimes();if(t.length<2){lightLine();return}
  let k=0;t.forEach((x,j)=>{if(x!=null&&au.currentTime>=x-.05)k=j});
  if(k!==cur)show(k);
  lightLine();
}
// 逐句：正在唱的那句亮、唱過的變淡（有人聲分析過才有）
function lightLine(){
  const L=getLines(),sub=document.getElementById('sub');if(!sub)return;
  const on=au&&!au.paused&&!rec&&L.length;sub.classList.toggle('lines',!!on);if(!on)return;
  let k=-1;L.forEach((x,j)=>{if(x!=null&&au.currentTime>=x-.3)k=j});
  sub.querySelectorAll('.ln').forEach(el=>{const j=+el.dataset.l;el.classList.toggle('on',j===k);el.classList.toggle('past',j<k)});
}
app.addEventListener('change',async e=>{
  if(e.target.id!=='afile')return;const f=e.target.files[0];if(!f)return;
  // 不設 accept：iPad 的「檔案」裡 OneDrive 的 mp3 常被認不出類型而變灰色選不到，改成選完再檢查
  if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|aac|wav|aif|aiff|flac|ogg|opus|caf)$/i.test(f.name)){alert('這個檔案看起來不是音樂檔（mp3、m4a、wav…）');return}
  const which=e.target.dataset.for||'inst';
  try{await putFile(key+'|'+which,f)}catch(err){alert('這台裝置沒辦法存這個檔案');return}
  if(which==='vocal'){hasVocal=true;drawPlayer();autoAlign(f);return}
  if(au)au.pause();rec=false;try{localStorage.setItem('scene-track',which)}catch(e){}await loadAudio(which);
  hint(getTimes().length>1?`${TRACK[which]}放好了，可以直接播放`:`${TRACK[which]}放好了，按「對拍」跟著音樂點一次，之後就會自動換段`);hintT=setTimeout(()=>hint(''),4000);
});
/* ---------- 自動對拍：用 Moises 分出來的純人聲，找出每句歌開始唱的位置 ---------- */
// 人聲檔只拿來分析，不播放。和伴奏、原唱是同一首分出來的，所以秒數直接共用
// 已經手動對過段：只補逐句，段的秒數照你點的（除非按「自動對」整個重算）
async function autoAlign(file,redo,quiet){
  file=file||await getFile(key+'|vocal');if(!file)return;
  const keep=!redo&&getTimes().length===SCENES[key].steps.length?getTimes():null;
  if(!quiet)hint('正在聽人聲，找每段開始的地方…');
  let buf;
  try{
    const C=window.AudioContext||window.webkitAudioContext,ctx=new C();
    const ab=await file.arrayBuffer();
    buf=await new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)});
    ctx.close&&ctx.close();
  }catch(err){hint('');alert('這個人聲檔讀不出來，換 mp3 或 wav 試試');return}
  const res=alignTimes(buf,keep);
  if(!res){hint('這個檔案聽不太出唱歌的地方，用「對拍」手動點一次吧');hintT=setTimeout(()=>hint(''),4000);return}
  if(!keep)setTimes(res.sec);setLines(res.lines);rec=false;drawPlayer();
  if(!au||au.paused)show(cur);
  if(!quiet)hint(keep?'逐句對好了！段落照你原本點的，播放時唱到哪句哪句會亮':'自動對好了！播放會自己換段、逐句亮，哪段不準就停在那段按「從這段改」');hintT=setTimeout(()=>hint(''),4500);
}
// 每 50 毫秒算一次音量 → 有聲音的地方連成一句一句 → 依每段幾行歌詞分組，段和段之間盡量切在比較長的空檔
function alignTimes(buf,keep){
  const sr=buf.sampleRate,hop=Math.round(sr*.05),nf=Math.floor(buf.length/hop),dt=hop/sr;
  const ch=[];for(let c=0;c<buf.numberOfChannels;c++)ch.push(buf.getChannelData(c));
  const e=new Float32Array(nf);
  for(let f=0;f<nf;f++){let s=0;const a=f*hop;for(let i=a;i<a+hop;i+=2){let v=0;for(const d of ch)v+=d[i];s+=v*v}e[f]=Math.sqrt(s/(hop/2))/ch.length}
  const sorted=Array.from(e).sort((a,b)=>a-b),p95=sorted[Math.floor(nf*.95)]||0;
  if(p95<1e-4)return null;
  const th=Math.max(p95*.1,sorted[Math.floor(nf*.2)]*3);
  // 有聲音的片段；中間停不到 0.35 秒算同一句，短於 0.25 秒的雜音不算
  let ph=[],on=-1,last=-1;
  for(let f=0;f<nf;f++){if(e[f]>th){if(on<0)on=f;else if((f-last)*dt>.35){ph.push([on*dt,(last+1)*dt]);on=f}last=f}}
  if(on>=0)ph.push([on*dt,(last+1)*dt]);
  ph=ph.filter(([a,b])=>b-a>=.25);
  const steps=SCENES[key].steps,N=steps.length;
  const want=steps.map((s,i)=>blocks&&blocks[i]?blocks[i].length:s.n);
  const P=ph.length;if(P<N)return null;
  let start;
  if(keep){
    // 用你點的段落時間：每段從離那個時間最近的一句開始
    start=[0];for(let i=1;i<N;i++){let best=start[i-1]+1,bd=1e9;for(let a=start[i-1]+1;a<=P-(N-i);a++){const d=Math.abs(ph[a][0]-keep[i]);if(d<bd){bd=d;best=a}}start.push(best)}
    return {sec:keep,lines:lineTimes(ph,start,want)};
  }
  const gap=ph.map((p,j)=>j?p[0]-ph[j-1][1]:p[0]);
  const med=gap.slice(1).sort((a,b)=>a-b)[Math.floor((P-1)/2)]||.5;
  const gs=j=>Math.log(1+Math.min(gap[j],12)/med);
  // dp[i][j]：前 i 段用掉前 j 句的最小代價。每段句數離歌詞行數越遠越扣分，段的開頭空檔越長越加分
  const INF=1e9,dp=[...Array(N+1)].map(()=>new Float64Array(P+1).fill(INF)),bk=[...Array(N+1)].map(()=>new Int32Array(P+1));
  dp[0][0]=0;
  for(let i=1;i<=N;i++)for(let j=i;j<=P-(N-i);j++)for(let a=i-1;a<j;a++){
    if(dp[i-1][a]>=INF)continue;const d=(j-a)-want[i-1];
    const c=dp[i-1][a]+d*d/Math.max(1,want[i-1])-(i>1?2*gs(a):0);
    if(c<dp[i][j]){dp[i][j]=c;bk[i][j]=a}
  }
  start=[];let j=P;for(let i=N;i>=1;i--){const a=bk[i][j];start[i-1]=a;j=a}
  // 每段比開口早一點換（最多早 1 秒），先看到歌詞
  const sec=start.map((a,i)=>i?Math.max(ph[a-1][1],ph[a][0]-Math.min(1,gap[a]/2)):0).map(t=>Math.round(t*100)/100);
  return {sec,lines:lineTimes(ph,start,want)};
}
// 一段裡的句子對到歌詞行：句子太多就併在小空檔，太少就把最長的一句切半
function lineTimes(ph,start,want){
  const out=[];
  start.forEach((a,i)=>{
    const b=i+1<start.length?start[i+1]:ph.length,n=want[i];
    let seg=ph.slice(a,b).map(p=>[p[0],p[1]]);
    while(seg.length>n){let k=1,g=1e9;for(let x=1;x<seg.length;x++){const d=seg[x][0]-seg[x-1][1];if(d<g){g=d;k=x}}seg[k-1][1]=seg[k][1];seg.splice(k,1)}
    while(seg.length<n&&seg.length){let k=0;seg.forEach((p,x)=>{if(p[1]-p[0]>seg[k][1]-seg[k][0])k=x});const [s0,e0]=seg[k],m=(s0+e0)/2;seg.splice(k,1,[s0,m],[m,e0])}
    for(let k=0;k<n;k++)out.push(seg[k]?Math.round(seg[k][0]*100)/100:null);
  });
  return out;
}
render();
</script>
