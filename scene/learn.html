<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學歌地圖</title>
<meta name="theme-color" content="#0d0b09">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=1">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 學歌地圖：一張學騎腳踏車的圖＝學一首歌的四個階段（歌由誰撐著：外面帶你 → 你跟著 → 你自己 → 你帶著歌走） */
:root{
  --bg:#0d0b09; --ink:#f6efe4; --muted:#bfb3a3; --line:rgba(255,255,255,.16); --glow:#f2c27b; --glow-soft:rgba(242,194,123,.16);
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.bar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.bar a{color:var(--muted);text-decoration:none;font-size:14px}
.bar h1{margin:0;font-family:var(--display);font-size:22px}
.bar .by{color:var(--muted);font-size:13px}
.pic{position:relative;max-width:1200px;margin:0 auto}
.pic img{display:block;width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px;cursor:pointer;color:#fff;font:inherit}
.spot i{width:14px;height:14px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 6px var(--glow-soft),0 0 16px var(--glow);font-style:normal}
.spot b{font-family:var(--display);font-size:18px;font-weight:700;text-shadow:0 1px 8px #000,0 0 3px #000;white-space:nowrap}
.spot.on i{transform:scale(1.35)}
.lead{max-width:1200px;margin:14px auto 0;padding:0 16px;color:var(--muted);font-size:14px;line-height:1.6}
.lead b{color:var(--glow);font-weight:600}
.cards{max-width:1200px;margin:12px auto 0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;background:rgba(255,255,255,.03);transition:border-color .3s,background .3s}
.card.on{border-color:var(--glow);background:rgba(242,194,123,.08)}
.card h2{margin:0 0 2px;font-family:var(--display);font-size:20px;display:flex;align-items:baseline;gap:8px}
.card h2 small{font-family:var(--body);font-size:12px;color:var(--glow);font-weight:500}
.card .who{font-size:12px;color:var(--muted);margin-bottom:10px}
.card dl{margin:0;font-size:13px;line-height:1.55}
.card dt{color:var(--glow);font-size:12px;margin-top:8px}
.card dd{margin:2px 0 0}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cr{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.cr em{font-style:normal;font-size:11px;color:var(--muted);min-width:2.4em}.cr small{margin-left:auto;font-size:11px;color:var(--muted)}
.cr.gone{border-style:dashed;opacity:.55;flex-wrap:wrap}.cr.gone s{text-decoration-color:rgba(255,120,110,.8)}.cr.gone small{margin-left:0;flex-basis:100%}
.cr.lv1{background:rgba(242,194,123,.10);border-color:rgba(242,194,123,.35)}.cr.lv2{background:rgba(242,194,123,.22);border-color:rgba(242,194,123,.6)}.cr.lv3{background:rgba(242,194,123,.38);border-color:var(--glow)}
.test{margin-top:10px;font-size:12px;color:var(--glow)}
.cells{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cells span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
.cells span.lv1{background:rgba(242,194,123,.10);border-color:rgba(242,194,123,.35);color:var(--ink)}
.cells span.lv2{background:rgba(242,194,123,.22);border-color:rgba(242,194,123,.6);color:var(--ink)}
.cells span.lv3{background:rgba(242,194,123,.38);border-color:var(--glow);color:#fff}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.cards{grid-template-columns:1fr}.spot b{font-size:14px}.spot i{width:11px;height:11px}.bar h1{font-size:20px}}
.songs{display:flex;gap:6px;flex-wrap:wrap;max-width:1200px;margin:12px auto 0;padding:0 16px}
.songs a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px}.songs a.on{color:var(--glow);border-color:var(--glow)}
.stage{max-width:1200px;margin:12px auto 0;padding:0 16px;font-size:13.5px;line-height:1.6;color:var(--muted);min-height:3.2em}.stage b{color:var(--glow);font-family:var(--display);font-size:17px;margin-right:6px}.stage em{font-style:normal;color:var(--ink)}
.nat{max-width:1200px;margin:10px auto 0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.pgh{margin:4px 2px 10px;color:var(--glow);font-size:15px;font-weight:600}.pgh small{margin-left:8px;color:var(--muted);font-weight:400;font-size:12px}
.ngrid{display:grid;grid-template-columns:3em repeat(5,1fr);gap:10px;align-items:stretch}
.nh{font-size:14px;color:var(--ink);text-align:left;font-weight:600;padding:8px 10px;border:1px solid transparent;align-self:stretch;display:flex;flex-direction:column;gap:3px;border-radius:12px;cursor:pointer;transition:background .3s}.nh small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.nh em{display:block;font-style:normal;font-size:11px;color:var(--glow);font-weight:400;margin-top:3px;line-height:1.35}.nh.on{background:var(--glow-soft);border-color:rgba(242,194,123,.45)}
.nh .nn{font-family:var(--display);font-size:19px}.nh .ng{font-size:11.5px;font-weight:400;line-height:1.45;color:var(--ink);opacity:.85}.nh .ng i{font-style:normal;color:var(--muted);margin-right:4px}
.lead2{margin:0 2px 12px;font-size:13px;line-height:1.6;color:var(--muted)}.lead2 b{color:var(--glow);font-weight:600}
.nl{font-size:13px;color:var(--muted);align-self:center}
.nc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:inherit;min-width:0;cursor:pointer;transition:box-shadow .3s}
.nc .pgt{font-family:var(--display);font-size:19px}.nc small{font-size:11.5px;color:var(--muted);line-height:1.35}
.nc.lv1{background:rgba(242,194,123,.10);border-color:rgba(242,194,123,.35)}.nc.lv2{background:rgba(242,194,123,.22);border-color:rgba(242,194,123,.6)}.nc.lv3{background:rgba(242,194,123,.38);border-color:var(--glow);box-shadow:0 0 14px rgba(242,194,123,.35)}
.nc.today .pgt::after{content:' ✦';color:var(--glow)}
.nc.col{box-shadow:0 0 0 2px rgba(242,194,123,.55)}
.nc.gone{opacity:.55;border-style:dashed;background:none;cursor:default}.nc.gone s{font-size:13px;color:var(--muted);text-decoration-color:rgba(255,120,110,.8)}
.nc .vk{position:absolute;top:8px;right:8px;font-size:11px;line-height:1;padding:4px 7px;border-radius:99px;border:1px dashed rgba(242,194,123,.5);color:var(--glow)}
.nc .vk.on{border-style:solid;background:rgba(242,194,123,.18)}.nc .vk.grad{border:0;background:none;font-size:17px;padding:0}.nc .vk.vt{box-shadow:0 0 0 2px rgba(242,194,123,.45)}
.nnote{margin:12px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.ro .nc:not(.gone){cursor:default}.ro .vk{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}.toast.on{opacity:1}
@media (max-width:640px){.nh .ng{display:none}.nh{padding:4px}.nh .nn{font-size:14px}.ngrid{grid-template-columns:2.2em repeat(5,1fr);gap:5px}.nc{padding:8px 8px 24px}.nc .pgt{font-size:14px}.nc small{font-size:10px}.nc.gone{padding-bottom:8px}.nc.gone small{font-size:9.5px}.nc .vk{top:auto;bottom:5px;right:5px}.nh{font-size:12.5px}.nh em{font-size:9px}}
/* 一頁：表格疊在圖上半部（天空），人都在下半部 */
.bar{flex-wrap:wrap}.bar .songs{margin:0 0 0 auto;padding:0;max-width:none}
.songs a{padding:3px 10px;font-size:12px}
.pic{max-width:min(1200px,calc((100vh - 64px) * 1.79))}
.pic .nat{position:absolute;left:1.2%;right:1.2%;top:1.6%;margin:0;padding:8px 10px 10px;border-radius:14px;background:rgba(12,10,8,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);max-width:none}
.pic .pgh{margin:0 2px 6px;font-size:14px}.pic .pgh small{font-size:11px}
.pic .ngrid{grid-template-columns:2.4em 1fr 1fr .8fr 1fr 1fr;gap:5px 6px}
.pic .nh{padding:3px 6px;gap:1px}.pic .nh .nn{font-size:15px}.pic .nh .nn small{display:inline;margin-left:6px;font-size:10.5px}.pic .nh em{font-size:10px;margin-top:0}
.pic .nl{font-size:11.5px}
.pic .nc{padding:6px 10px;min-height:40px;justify-content:center;gap:1px}.pic .nc .pgt{font-size:15px}.pic .nc small{font-size:10px}
.pic .nc .vk{top:50%;transform:translateY(-50%);right:7px;font-size:10px;padding:3px 6px}
.pic .nc.gone{padding:6px 10px}.pic .nc.gone s{font-size:11px}
.stg{position:absolute;left:1.2%;bottom:2%;max-width:56%;padding:8px 12px;border-radius:12px;background:rgba(12,10,8,.7);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:1px}
.stg b{font-family:var(--display);font-size:16px;color:var(--glow)}.stg i{font-style:normal;color:var(--muted);margin-right:5px}
.foot{max-width:1200px;margin:6px auto 0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px)}.foot .nnote{margin:0;font-size:11.5px;line-height:1.6}
@media (max-width:760px){.pic{max-width:none}.pic .nat{position:static;border-radius:0;background:none;padding:10px 12px}.bar .songs{margin:4px 0 0;flex-basis:100%}.stg{position:static;max-width:none;border-radius:0;margin:0}.pic .nc .vk{top:auto;transform:none;bottom:4px;right:4px}.pic .nc{padding-bottom:20px}.pic .nh em{font-size:9px}}
.imgw{position:relative}
.nh .bk{font-size:12px;font-weight:400;color:var(--ink)}.nh .bt{font-size:10.5px;font-weight:400;color:var(--muted)}
.nl small{display:block;font-size:10px;color:var(--muted);opacity:.85}
.foot .nnote b{color:var(--glow);font-weight:600}
.mode{display:flex;margin-left:auto;border:1px solid rgba(242,194,123,.45);border-radius:99px;overflow:hidden}.mode button{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:7px 18px;cursor:pointer}.mode button.on{background:rgba(242,194,123,.18);color:var(--glow);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:0}.pair .nc{min-width:0}.pair .nc+.nc{border-color:rgba(160,200,255,.35)}.pair .nc+.nc::before{content:'←';position:absolute;left:-11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--glow)}
@media (max-width:640px){.pair{grid-template-columns:1fr}.pair .nc+.nc::before{content:'↑';left:50%;top:-10px;transform:none}}
.sn{display:none}@media (max-width:640px){.pic .ngrid{grid-template-columns:2.2em repeat(5,1fr)}.ln{display:none}.sn{display:inline}.ngrid{gap:4px}.nc{padding-left:5px;padding-right:5px}.nh .nn{font-size:13px}}
.nc .rt{position:absolute;left:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:#c0392b;color:#fff;font:700 11px/18px system-ui;text-align:center;font-style:normal;box-shadow:0 1px 4px rgba(0,0,0,.5);z-index:1}.nc .rt.fix{background:#7a5a2a}
.fix{display:block;margin-bottom:3px;color:#9fd3ff}.fix b{color:#fff;background:#7a5a2a;border-radius:50%;display:inline-block;width:15px;height:15px;font:700 10px/15px system-ui;text-align:center}.fix b.k{all:unset;color:#9fd3ff;font-weight:700}
.route{display:block;margin-bottom:3px;color:#ff9c8f}.route b.k{all:unset;color:#ff9c8f;font-weight:700}.route b{color:#fff;background:#c0392b;border-radius:50%;display:inline-block;width:15px;height:15px;font:700 10px/15px system-ui;text-align:center;margin:0 2px}
.pic .nh .bk{font-size:11.5px}.pic .nh .bt{font-size:10px}
@media (max-width:760px){.nh .bk,.nh .bt{display:none}.nl small{font-size:8.5px}}
</style>
</head>
<body>
<div class="bar"><a id="back" href="javascript:history.length>1?history.back():location.href='../#songs'">← 返回</a><h1>學歌地圖・自然養成</h1><span class="by" id="by"></span><div class="songs" id="songs"></div></div>
<div class="pic">
  <div class="imgw"><img src="learn.jpg?v=1" alt="一個小孩學騎腳踏車的四個時刻：坐在長椅上看、爸爸扶著騎、爸爸放手自己騎、騎進花草地">
  <div id="spots"></div></div>
  <div class="nat" id="nat"></div>
  <div class="stg" id="stg" hidden></div>
</div>
<div class="foot" id="foot"></div>
<div class="toast" id="toast"></div>
<script>
const SONGS=[['jiayi','甲乙丙丁'],['summer','盛夏的果實'],['darwin','達爾文'],['hands','小手拉大手'],['prank','惡作劇'],['zhizu','知足'],['hug','大大的擁抱'],['houlai','後來']];
const STAGES=[
  {n:'浸泡',sub:'聽',bike:'坐在長椅上看別人騎',test:'音樂突然停，你接得出下一句',btest:'閉上眼，說得出他下一步往哪轉',spot:{x:12,y:52},who:'坐在長椅上，看別人騎',goal:'不花力氣，讓歌的樣子自己長進腦中。',state:'知道下一句往哪走；歌被切掉會覺得「欸，還沒完」。'},
  {n:'模仿',sub:'出聲',bike:'爸爸扶著座墊，你自己踩',test:'原唱拿掉（只放伴奏），每段還是自己準時進',btest:'爸爸偷偷放手一下，你還在騎',spot:{x:40,y:46},who:'爸爸扶著座墊騎',goal:'把聽到的對應到自己的聲音，照原唱複製音高、節奏、斷句和換氣。',state:'有原唱或伴奏帶著時，唱得對、不會掉。'},
  {n:'哼唱',num:'↔',sub:'半出聲・卡住來這修',bike:'爸爸只輕輕碰著',test:'只出一點聲，音高拍子還對',btest:'爸爸快放手，你幾乎自己騎',spot:null,who:'在爸爸扶著和放手之間（爸爸的手只輕輕碰著）',goal:'出聲和腦內唱之間的橋，也是卡住時的修理站：拿掉字，只剩音高和氣流。音不準→跟原唱哼對答案；唱不順→哼著感受氣流，一口氣送完再放字。',state:'哼的時候不用想，音在對的地方、氣一路順到句尾；張口唱詞也不吃力。'},
  {n:'內化',sub:'腦內唱',bike:'爸爸放手，你自己騎',test:'聲音突然消失幾秒，你腦中繼續唱；回來時還對得上',btest:'騎過一段沒人看的路，還在路上',spot:{x:62,y:44},who:'爸爸放手，自己騎',goal:'不靠外面的聲音，歌在你身上也站得住。',state:'沒有音樂，音準和速度也穩；歌會自己在腦中響起。'},
  {n:'風格化',sub:'我的唱法',bike:'騎進花草地，走自己的路線',test:'換個唱法還是這首歌，而且說得出為什麼',btest:'換一條路騎還很穩，說得出為什麼這樣走',spot:{x:85,y:44},who:'騎進花草地，走自己的路線',goal:'唱法變成「選擇」，不是「照抄」。',state:'換速度、強弱、換氣、裝飾，還是這首歌，而且說得出為什麼。'}];
// 列＝音樂（原曲/伴奏/靜音），欄＝四個階段；陣列＝消失的格子（槓掉＋為什麼）
// 她畫的路線（11-04）：蛇行往下；清唱音不準就回「跟原唱哼」對答案
const ROUTE={n_sing:1,n_hear:2,n_lead:3,n_inst:4,n_head:5,n_hum:6,n_free:7,n_hum_o:'↺'};
const GRID=[
  ['原曲',['n_listen','常聽','放原曲，耳朵先習慣'],['n_sing','跟唱','放原曲，跟著一起唱'],['n_hum_o','跟原唱哼','放原曲，閉著嘴輕輕哼','原唱哼'],['n_hear','腦內聽','放原曲，在腦中跟著唱'],['風格化×原曲','原唱一直在旁邊，很難唱出自己的版本']],
  ['伴奏',['浸泡×伴奏','聽伴奏就知道唱到哪，其實已經是腦內補唱（內化）'],['n_lead','搶先唱','放伴奏，自己唱出主唱'],['n_hum_i','跟伴奏哼','放伴奏，主唱用哼的','伴奏哼'],['n_inst','腦內補唱','放伴奏，主唱在腦中唱'],['n_mine','我的版本','放伴奏，換速度、情緒、換氣']],
  ['靜音',['浸泡×靜音','沒聲音可聽；這時聽到的歌，其實已經是內化'],['n_free','隨口唱','沒音樂，洗澡走路就唱出來'],['n_hum','哼唱','沒音樂，閉著嘴跟腦內歌聲哼'],['n_head','腦內歌聲','沒音樂，腦中自己響起來'],['n_solo','清唱版本','沒音樂，用自己的唱法唱完']]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pgAll=()=>{try{return JSON.parse(localStorage.getItem('scene-prog-v1'))||{}}catch(e){return {}}};
const pgToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const natDays=(m,id)=>Array.isArray(m[id])?m[id]:m[id]?[m[id]]:[];
const natLv=n=>n>=5?3:n>=2?2:n?1:0;
function natTap(k,id){const a=pgAll(),m=a[k]||(a[k]={}),t=pgToday();let d=natDays(m,id).slice();d=d.includes(t)?d.filter(x=>x!==t):d.concat(t);if(d.length)m[id]=d;else delete m[id];try{localStorage.setItem('scene-prog-v1',JSON.stringify(a))}catch(e){}return d.includes(t)}
let song=decodeURIComponent((location.hash||'').slice(1)),col=-1,tT=0;
if(!SONGS.some(x=>x[0]===song))song='';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),1300)}
function draw(){
  const m=song?pgAll()[song]||{}:{},t=pgToday(),title=(SONGS.find(x=>x[0]===song)||[])[1]||'';
  document.getElementById('by').textContent=title?'・'+title:'';
  if(!EMB)document.getElementById('songs').innerHTML=SONGS.map(([k,n])=>`<a href="#${k}" class="${k===song?'on':''}">${n}</a>`).join('');
  const cell=(c,ci)=>{if(Array.isArray(c[0]))return `<div class="pair">${c.map(x=>cell(x,ci)).join('')}</div>`;if(c.length===2)return `<div class="nc gone" title="${esc(c[1])}"><s>${c[0].split('×')[0]}×${c[0].split('×')[1]}</s></div>`;
    const [id,nm,tip,sn]=c,d=natDays(m,id),last=d[d.length-1],v=natDays(m,'v_'+id),vt=v.includes(t);
    return `<button data-act="nat" data-s="${id}" class="nc lv${natLv(d.length)}${d.includes(t)?' today':''}${ci===col?' col':''}">${ROUTE[id]?`<b class="rt${ROUTE[id]==='↺'?' fix':''}">${ROUTE[id]}</b>`:''}<span class="pgt">${sn?`<span class="ln">${nm}</span><span class="sn">${sn}</span>`:nm}</span>${d.length?`<small>${d.length} 天・${last.slice(5).replace('-','/')}</small>`:''}<span class="vk${v.length>=3?' grad':v.length?' on':''}${vt?' vt':''}" data-act="natv" data-s="v_${id}">${v.length>=3?'🎓 學會':v.length?'過關 ✓'+v.length:'過關？'}</span></button>`};
  document.getElementById('nat').innerHTML=`<div class="pgh">${title?esc(title):'先在右上選一首歌'}<small>學歌＝學騎腳踏車。→ 往右：從看別人騎，到自己騎出路線　↓ 往下：輔助越拿越少（有人扶 → 輔助輪 → 什麼都沒有）</small></div>
  <div class="ngrid${song?'':' ro'}"><span></span>${STAGES.map((s,i)=>`<span class="nh${i===col?' on':''}" data-act="col" data-i="${i}"><span class="nn">${s.num||(i>2?i:i+1)} ${s.n}<small>${s.sub}</small></span><span class="bk">🚲 ${esc(s.bike)}</span><em>過關：${esc(s.test)}</em><span class="bt">像是${esc(s.btest)}</span></span>`).join('')}
  ${GRID.map((r,ri)=>`<span class="nl">${r[0]}<small>${['有人扶','輔助輪','全靠自己'][ri]}</small></span>`+r.slice(1).map((c,ci)=>cell(c,ci)).join('')).join('')}</div>`;
  document.getElementById('foot').innerHTML=`<p class="nnote"><span class="route"><b class="k">我的路線：</b><b>1</b>跟唱 → <b>2</b>腦內聽 → <b>3</b>搶先唱 → <b>4</b>腦內補唱 → <b>5</b>腦內歌聲 → <b>6</b>哼唱 → <b>7</b>隨口唱</span><span class="fix"><b class="k">卡住了 → 回 ↔ 哼唱這一欄修：</b>音不準 → <b>↺</b> 跟原唱哼對答案｜唱不順、字卡卡 → 用哼的感受氣流，整句一口氣送出去，再把字放回去（例：知足「總是不能懂…」）｜想不起詞 → 刻意的背架構表</span><b>怎麼用：</b>點格子＝今天有這樣唱過（越多天越亮）。照那一欄的「過關」方法測過，就按格子右邊的「過關？」。不同天過關 3 次＝🎓 學會，像不用人扶也騎得穩。<br><b>浸泡和內化都很安靜，差在哪？</b>像「坐在椅子上看」跟「自己騎著」：音樂一停你就停＝還在看；音樂停了你還在騎＝內化。</p>`;
  const sg=document.getElementById('stg');if(col>=0){const x=STAGES[col];sg.hidden=false;sg.innerHTML=`<b>${x.num||(col>2?col:col+1)} ${x.n}</b><span>圖上：${esc(x.who)}</span><span><i>目標</i>${esc(x.goal)}</span><span><i>做到時</i>${esc(x.state)}</span>`}else sg.hidden=true;
  document.querySelectorAll('.spot').forEach(b=>b.classList.toggle('on',+b.dataset.i===col));
}
// 從情境頁打開（embed=1）：留在情境頁裡，歌不會停；右上換成「自然｜刻意」切換
const EMB=/[?&]embed=1/.test(location.search),toParent=t=>parent.postMessage({learn:t},'*');
if(EMB){document.getElementById('back').href='javascript:void 0';document.getElementById('back').onclick=e=>{e.preventDefault();toParent('close')};
  const sg=document.getElementById('songs');sg.className='mode';sg.id='modeb';sg.innerHTML='<button class="on">自然</button><button data-act="deli">刻意</button>';}
document.getElementById('spots').innerHTML=STAGES.map((s,i)=>!s.spot?'':`<button class="spot" data-act="col" data-i="${i}" style="left:${s.spot.x}%;top:${s.spot.y}%"><i></i><b>${s.num||(i>2?i:i+1)} ${s.n}</b></button>`).join('');
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='deli'){toParent('deli');return}
  if(act==='col'){col=+a.dataset.i===col?-1:+a.dataset.i;draw();}
  else if(!song)toast('先選一首歌');
  else if(act==='natv'){toast(natTap(song,a.dataset.s)?'今天過關了 ✓':'取消今天這次過關');draw()}
  else if(act==='nat'){toast(natTap(song,a.dataset.s)?'點亮了':'取消今天這次');draw()}});
addEventListener('hashchange',()=>{song=decodeURIComponent(location.hash.slice(1));if(!SONGS.some(x=>x[0]===song))song='';draw()});
draw();
</script>
</body>
</html>
