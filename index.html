<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1"><link rel="icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vocal"><meta name="theme-color" content="#EDEFEA"></head><body>
<title>街演 App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-hand phone app. Sticky title bar, scrolling content, fixed bottom tab bar; edits open in bottom sheets. */
:root{
  --bg:#EDEFEA; --surface:#FAFBF8; --sunk:#E2E6E0; --ink:#1D2829; --muted:#5D6B6A; --line:#CDD4CE;
  --accent:#1F6E77; --accent-ink:#FFFFFF; --accent-soft:#D3E6E7;
  --coin:#8F6206; --coin-bg:#F5E6BF;
  --warn:#A83E1B; --warn-bg:#F6DED3; --ok:#27704A; --ok-bg:#D9EEE0;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111718; --surface:#1A2324; --sunk:#0C1112; --ink:#E4EBE9; --muted:#93A3A1; --line:#2C393A;
  --accent:#62B6BF; --accent-ink:#0A1A1C; --accent-soft:#1D3639;
  --coin:#E6B84E; --coin-bg:#3A2F14; --warn:#F08A66; --warn-bg:#3B1E15; --ok:#6CC48F; --ok-bg:#163223;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111718; --surface:#1A2324; --sunk:#0C1112; --ink:#E4EBE9; --muted:#93A3A1; --line:#2C393A;
  --accent:#62B6BF; --accent-ink:#0A1A1C; --accent-soft:#1D3639;
  --coin:#E6B84E; --coin-bg:#3A2F14; --warn:#F08A66; --warn-bg:#3B1E15; --ok:#6CC48F; --ok-bg:#163223;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.02em}
.top .sync{font-size:12px;color:var(--muted)}
h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px}
.sec{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:48px;width:100%;background:none;border:0;text-align:left}
.row .main{flex:1;min-width:0}
.row .title{font-weight:500}
.row .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.coin{background:var(--coin-bg);color:var(--coin)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ghost{background:none;border:0;color:var(--accent);font-weight:500;padding:8px 4px;min-height:40px}
.banner{border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
/* Next show */
.show{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.show .when{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.15}
.show .where{font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.progress{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.check{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:46px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.check.rain span::after{content:"雨天";margin-left:8px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none;display:inline-block}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.fold>summary{padding:12px 14px;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold>summary::after{content:"＋";color:var(--muted)}
details.fold[open]>summary::after{content:"－"}
details.fold>.list{border:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.glabel{padding:8px 14px 4px;font-size:12px;color:var(--muted);letter-spacing:.08em;background:var(--sunk)}
/* setlist */
.setlist{counter-reset:s}
.setlist li .n{width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.handle{touch-action:none;cursor:grab;flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);background:none;border:0;font-size:18px}
li.dragging{background:var(--accent-soft)}
.tempo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex:none;background:var(--sunk);color:var(--muted)}
.tempo.t快{background:var(--warn-bg);color:var(--warn)}
.tempo.t中{background:var(--coin-bg);color:var(--coin)}
.tempo.t慢{background:var(--accent-soft);color:var(--accent)}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button,.seg label{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;font-size:14px;color:var(--muted);text-align:center;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--surface);color:var(--ink);font-weight:500}
.seg label{padding:0;display:flex}
.seg label span{flex:1;padding:7px 10px;border-radius:999px}
.seg input{position:absolute;opacity:0;pointer-events:none}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:64px 1fr 84px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .track{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--coin);border-radius:4px}
.bar .v{text-align:right}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,17,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.progress>i{transition:none}}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.sheet>header h2{font-size:18px;text-align:center;flex:1}
.sheet-body{overflow-y:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.f textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.f2{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.pick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--display);font-weight:700;padding:0 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
/* stage cards */
#present{position:fixed;inset:0;z-index:40;background:var(--sunk);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px))}
#present .bar-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
#present .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;user-select:none;touch-action:pan-y}
#present .stage h2{font-size:clamp(30px,8vw,56px);line-height:1.2;color:var(--accent)}
#present .stage p{font-family:var(--display);font-size:clamp(22px,5.6vw,40px);line-height:1.5;margin:0;white-space:pre-wrap}
#present .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#present .nav .btn{min-height:56px;font-size:17px}
.dots{display:flex;gap:6px;justify-content:center;padding-block:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.cardrow .body{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link{color:var(--accent);text-decoration:none;font-size:13px}
</style>

<div class="app">
  <header class="top"><h1 id="title">下一場</h1><span class="sync" id="sync">載入中…</span></header>
  <main id="main"></main>
</div>
<div class="tabs"><nav aria-label="分頁">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>下一場</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>紀錄</button>
  <button data-tab="songs"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>歌單</button>
  <button data-tab="gear"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9.5l2 2 3.5-3.5M8 15h8"/></svg>設備清單</button>
  <button data-tab="host"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>主持稿</button>
</nav></div>
<div id="sheet" hidden></div>
<div id="present" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
const COLS=['songs','venues','records','gear','checks','cards','meta'];
const GROUPS=['前一晚充電','出門準備','其他','隨身','當日'];
const ONSITE=['現場・表演','現場・設備','現場・腳架'];
const SONG_GROUPS=['溫馨','開放','商演','RenewSV'];
const LEVELS=['練習中','可上台','拿手'];
const TEMPOS=['快','中','慢'];
const REASONS=['雨天','夥伴取消','設備壞','其他'];
const TITLES={today:'下一場',log:'表演紀錄',songs:'歌單',gear:'設備與清單',host:'主持稿'};
const LS='busk-app-v1';
let S={}; COLS.forEach(c=>S[c]={});
let db=null, mode='loading', downloads=null;
let tab='today', logSeg='list', gearSeg='list', songFilter='全部', songQ='';

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv-SE');
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('en-US');
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function parseD(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(s,withYear){const d=parseD(s);if(!d)return '';return (withYear?d.getFullYear()+'/':'')+(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）'}
function secs(len){if(!len)return 0;const t=String(len).trim();if(t.includes(':')){const[m,s]=t.split(':');return (+m||0)*60+(+s||0)}return Math.round((parseFloat(t)||0)*60)}
function mmss(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0')}
const sorted=(col,key='ts')=>Object.entries(S[col]).map(([id,v])=>({id,...v})).sort((a,b)=>((a[key]??0)>(b[key]??0)?1:(a[key]??0)<(b[key]??0)?-1:0));
const next=()=>S.meta.next||{};
const partnerName=p=>(p&&p.trim()&&p.trim()!=='自己')?p.trim():'';

/* ---------- storage ---------- */
function saveCache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadCache(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v)COLS.forEach(c=>S[c]=v[c]||{})}catch(e){}}
const wq={};
function put(col,id,obj){
  S[col][id]=obj; saveCache(); scheduleRender();
  if(!db)return;
  const k=col+'/'+id, q=wq[k]||(wq[k]={busy:false,val:undefined});
  q.val=obj; if(!q.busy)flush(k,col,id);
}
async function flush(k,col,id){
  const q=wq[k]; q.busy=true;
  while(q.val!==undefined){
    const v=q.val; q.val=undefined;
    try{ if(v===null) await db.collection(col).doc(id).delete(); else await db.collection(col).doc(id).set(v); }
    catch(e){ try{await new Promise(r=>setTimeout(r,600+Math.random()*600)); if(v===null) await db.collection(col).doc(id).delete(); else await db.collection(col).doc(id).set(v);}catch(e2){toast('沒有存到雲端（'+(e2.code||'連線問題')+'），稍後再按一次儲存')} }
  }
  q.busy=false;
}
function del(col,id){
  delete S[col][id]; saveCache(); scheduleRender();
  if(!db)return;
  const k=col+'/'+id, q=wq[k]||(wq[k]={busy:false,val:undefined});
  q.val=null; if(!q.busy)flush(k,col,id);
}
let tickTimer=null;
function putNextSoon(n){S.meta.next=n;saveCache();scheduleRender();clearTimeout(tickTimer);tickTimer=setTimeout(()=>put('meta','next',S.meta.next),500)}

/* ---------- render ---------- */
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  $('#title').textContent=TITLES[tab];
  $('#sync').textContent=mode==='cloud'?'已同步到雲端':mode==='local'?'只存在這台裝置':'載入中…';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  const focusQ=document.activeElement&&document.activeElement.id==='song-q';
  const html={today:vToday,log:vLog,songs:vSongs,gear:vGear,host:vHost}[tab]();
  $('#main').innerHTML=html;
  if(tab==='songs'){applySongSearch(); if(focusQ){const i=$('#song-q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(tab==='today'){const l=$('#today-set');if(l)enableDrag(l,ids=>{const n=clone(next());n.setlist=ids;put('meta','next',n)})}
  if(tab==='host'){const l=$('#card-list');if(l)enableDrag(l,ids=>ids.forEach((id,i)=>{if(S.cards[id]&&S.cards[id].order!==i)put('cards',id,{...S.cards[id],order:i})}))}
}

/* ---------- stats ---------- */
function stats(){
  const recs=sorted('records','date').filter(r=>r.status==='表演');
  const byMonth={},byVenue={},byPartner={},songCount={},songLast={};
  recs.forEach(r=>{
    const m=(r.date||'').slice(0,7); byMonth[m]=(byMonth[m]||0)+(+r.mine||0);
    if(r.venueId){const v=byVenue[r.venueId]||(byVenue[r.venueId]={n:0,sum:0});v.n++;v.sum+=+r.total||0}
    const p=partnerName(r.partner)||'自己一個人';const pp=byPartner[p]||(byPartner[p]={n:0,sum:0,mine:0});pp.n++;pp.sum+=+r.total||0;pp.mine+=+r.mine||0;
    (r.songs||[]).forEach(id=>{songCount[id]=(songCount[id]||0)+1;if(!songLast[id]||r.date>songLast[id])songLast[id]=r.date});
  });
  return {recs,byMonth,byVenue,byPartner,songCount,songLast};
}

function confirmTap(btn){
  if(!btn.dataset.confirm)return true;
  if(btn.dataset.armed)return true;
  const orig=btn.textContent;btn.dataset.armed='1';btn.textContent=btn.dataset.confirm;

/* ---------- drag reorder (touch + mouse) ---------- */
function enableDrag(list,onDone){
  list.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.handle'); if(!h||!list.contains(h))return;
    const item=h.closest('li'); if(!item||item.parentElement!==list)return;
    e.preventDefault(); try{h.setPointerCapture(e.pointerId)}catch(_){}
    item.classList.add('dragging'); const start=[...list.children].map(li=>li.dataset.id).join();
    const move=ev=>{const y=ev.clientY;let before=null;for(const s of list.children){if(s===item)continue;const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break}}if(before!==item.nextSibling)list.insertBefore(item,before)};
    const up=()=>{item.classList.remove('dragging');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
      const ids=[...list.children].map(li=>li.dataset.id);if(ids.join()!==start)onDone(ids)};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}

});

      if(col==='meta'&&tickTimer&&S.meta.next)m.next=S.meta.next; // keep unsent ticks
      S[col]=m;pending.delete(col);if(!pending.size)mode='cloud';saveCache();scheduleRender();
    },err=>{if(err.code==='revoked'||err.code==='not_granted'){mode='local'}toast('雲端連線中斷，資料先存在這台裝置');scheduleRender()});
  });
})();
})();
